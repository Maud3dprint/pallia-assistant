<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palia Assistant</title>
<meta name="description" content="Ton compagnon pour progresser dans Palia : jardin, pêche, insectes, chasse, élevage, recettes, habitants et calendrier.">

<!-- Application installable -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7B4DE0">
<meta name="color-scheme" content="light">

<!-- Android et Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Palia Assistant">

<!-- iPhone et iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Palia">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- Icônes -->
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --fond:#F6F2FD;--blanc:#fff;--encre:#2C1A4F;--doux:#6E5D8E;--pale:#A99CC0;
  --violet:#7B4DE0;--violet2:#9B6BF0;--vclair:#EFE6FF;--trait:#EAE0FA;
  --rose:#E8467C;--vert:#2FB58A;--or:#F0A62F;--bleu:#3A9BE0;--rouge:#E0503A;
  --ombre:0 3px 16px rgba(70,30,140,.07);--r:22px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--fond);color:var(--encre);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.num{font-family:'Fredoka','Nunito',sans-serif;font-weight:600}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--trait);border-radius:9px}
.app{display:flex;min-height:100vh}
.rail{position:fixed;inset:0 auto 0 0;width:216px;background:var(--blanc);border-right:1px solid var(--trait);padding:20px 13px;display:flex;flex-direction:column;gap:3px;z-index:30;overflow-y:auto}
.logo{display:flex;gap:11px;align-items:center;padding:2px 8px 4px}
.logo .ic{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet2));display:grid;place-items:center;flex:none}
.logo b{font-family:'Fredoka';font-size:20px;display:block;line-height:1}
.logo i{font-style:normal;font-size:11px;font-weight:800;color:var(--doux);letter-spacing:1px;text-transform:uppercase}
.slogan{font-size:11.5px;color:var(--pale);font-weight:700;padding:0 8px 14px;line-height:1.4}
.sect{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--pale);padding:12px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;font-size:14.5px;font-weight:700;color:var(--doux);width:100%;text-align:left;transition:.15s}
.nav:hover{background:var(--fond);color:var(--encre)}
.nav[aria-current="page"]{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 4px 14px rgba(123,77,224,.3)}
.nav svg{flex:none}
.badge{margin-left:auto;background:var(--rose);color:#fff;font-size:11px;font-weight:900;min-width:21px;height:21px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.nav[aria-current="page"] .badge{background:#fff;color:var(--violet)}
.palier{display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:16px;
  background:var(--fond);margin-bottom:9px;border:2px solid transparent}
.palier.ok{background:#F2FBF7}
.palier.suivant{border-color:var(--violet);background:#FBF8FF}
.etape-q{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;
  background:var(--fond);margin-bottom:8px}
.liens{margin-top:16px;border-top:2px solid var(--trait);padding-top:14px}
.lien-b{margin-bottom:13px}
.lien-t{display:block;font-size:11.5px;font-weight:800;color:var(--doux);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.puce-l{display:inline-block;background:var(--fond);border-radius:99px;padding:7px 13px;font-size:12.5px;
  font-weight:700;color:var(--encre);margin:0 5px 5px 0;text-align:left}
.puce-l:hover{background:var(--vclair);color:var(--violet)}
.chaine{background:var(--fond);border-radius:16px;padding:14px 16px;margin-top:4px}
.ch-l{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;font-weight:700}
.ch-l span{color:var(--doux)}
.ch-l.tot{border-top:2px solid var(--trait);margin-top:5px;padding-top:11px;font-size:15.5px}
.ch-l.tot b{color:var(--violet);font-family:'Fredoka';font-size:17px}
.qual{display:flex;gap:11px;margin-top:14px}
.q-b{flex:1;background:var(--fond);border-radius:15px;padding:13px;text-align:center}
.q-b.etoile{background:#FFF7E9}
.q-b label{display:block;font-size:11.5px;font-weight:800;color:var(--doux);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.q-b input{width:100%;padding:9px;border-radius:11px;border:2px solid var(--trait);text-align:center;
  font-family:'Fredoka';font-size:20px;background:#fff}
.q-v{font-family:'Fredoka';font-size:24px}
.calcul{margin-top:16px;border-top:2px solid var(--trait);padding-top:12px}
.c-l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;font-weight:700}
.c-l span{color:var(--doux)}
.c-l.brut{border-top:1px solid var(--trait);margin-top:5px;padding-top:10px}
.c-l.brut b{color:var(--or);font-size:15px}
.c-l.moins b{color:var(--rouge)}
.c-l.net{border-top:2px solid var(--trait);margin-top:6px;padding-top:11px;font-size:15.5px}
.c-l.net b{color:var(--vert);font-family:'Fredoka';font-size:19px}
.mini-eng{width:22px;height:22px;border-radius:7px;background:#fff;border:1.5px solid var(--trait);
  font-weight:800;color:var(--violet);margin:0 4px;font-size:12px}
.vente-l{display:flex;align-items:center;gap:12px;padding:11px;border-radius:14px;background:var(--fond);margin-bottom:7px}
.parc-c{cursor:pointer;transition:.14s;border:2px solid transparent}
.parc-c:hover{transform:translateY(-3px);border-color:var(--trait)}
.parc-c.fini{background:linear-gradient(180deg,#F3FBF8,#fff);border-color:#CFF0E4}
.parc-e{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.pastille-n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-family:'Fredoka';font-size:17px;flex:none}
.pal-actif{border:2px solid var(--trait);background:linear-gradient(180deg,#FBF8FF,#fff)}
.obj{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:var(--fond);margin-bottom:9px}
.obj.fait{background:#EAF9F3}
.obj-chk{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--trait);background:#fff;
  display:grid;place-items:center;flex:none}
.obj.fait .obj-chk{border-color:var(--vert);background:#fff}
.obj-n{display:flex;align-items:center;gap:6px;flex:none}
.obj-n button{width:30px;height:30px;border-radius:10px;background:#fff;border:1.5px solid var(--trait);
  font-weight:800;color:var(--violet);display:grid;place-items:center;font-size:15px}
.obj-n button:hover{border-color:var(--violet)}
.obj-n b{font-family:'Fredoka';font-size:14px;min-width:82px;text-align:center}
.etape-p{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--trait)}
.etape-p:last-child{border:0}
.etape-p.bloque{opacity:.45}
.etape-p.cours{background:var(--fond);border-radius:14px;padding:12px;border:0;margin:4px 0}
.cal-scroll{overflow-x:auto;padding-bottom:6px}
.cal-zone{display:flex;gap:7px;min-width:min-content}
.cal-jours{display:grid;grid-template-rows:repeat(7,14px);gap:3px;padding-top:20px;font-size:9.5px;font-weight:800;color:var(--pale)}
.cal-jours span{display:grid;place-items:center;height:14px}
.cal-mois{display:grid;gap:3px;height:18px;font-size:10.5px;font-weight:800;color:var(--doux)}
.cal-mois .mois{white-space:nowrap}
.cal-grille{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px}
.case-v{width:14px;height:14px;display:block}
.case-j{width:14px;height:14px;border-radius:4px;display:block;cursor:pointer;transition:transform .12s,box-shadow .12s}
.case-j:hover{transform:scale(1.45);box-shadow:0 2px 8px rgba(70,30,140,.28);position:relative;z-index:3}
.case-j.auj{box-shadow:inset 0 0 0 2px var(--encre)}
.case-j.pop{animation:popcase .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes popcase{0%{transform:scale(1)}35%{transform:scale(1.9)}100%{transform:scale(1)}}
.bulle{position:fixed;z-index:60;background:var(--encre);color:#fff;padding:10px 13px;border-radius:12px;
  font-size:12.5px;font-weight:700;line-height:1.55;white-space:pre-line;pointer-events:none;display:none;max-width:230px;
  box-shadow:0 6px 22px rgba(30,10,70,.32)}
.toast-b{background:#fff;color:var(--encre);border-radius:99px;padding:6px 14px;
  font-weight:800;font-size:13px;margin-left:12px}
.toast-b:hover{background:var(--vclair)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--encre);color:#fff;
  padding:14px 24px;border-radius:99px;font-weight:800;font-size:15px;box-shadow:0 8px 28px rgba(30,10,70,.4);
  animation:monte .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes monte{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.lbl-c{font-size:12px;font-weight:800;color:var(--doux);margin:15px 0 7px;text-transform:uppercase;letter-spacing:.6px}
.barre-ajout{margin-bottom:16px;border:2px dashed var(--trait);box-shadow:none;background:#FCFAFF}
.barre-ajout .ct h3{font-size:15px;color:var(--doux)}
.crayon{position:absolute;top:9px;right:9px;font-size:12px;opacity:.45;z-index:3;line-height:1}
.crayon:hover{opacity:1}
.x-perso{margin-left:6px;color:var(--rouge);font-weight:800;font-size:12px;opacity:.6}
.x-perso:hover{opacity:1}
.tuile-cat{background:var(--fond);border:2px solid transparent;border-radius:16px;padding:13px 8px;text-align:center;transition:.14s}
.tuile-cat:hover{border-color:var(--violet);background:#FBF8FF;transform:translateY(-2px)}
.tuile-cat.plein{background:#EAF9F3}
.btn-img{border-color:var(--vclair);color:var(--violet);background:#FBF8FF}
.btn-img:hover{border-color:var(--violet)}
.btn-img b{font-family:'Fredoka';font-weight:600}
.bloc-f{padding:12px 0;border-bottom:1px solid var(--trait)}
.bloc-f .tt-f{font-size:12px;font-weight:800;color:var(--doux);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.bloc-f p{font-size:14px;font-weight:600;line-height:1.6}
.defi-actif{text-align:center;padding:30px 22px;background:linear-gradient(180deg,#FBF8FF,#fff);border:2px solid var(--trait)}
.chrono{font-family:'Fredoka';font-size:34px;color:var(--violet);margin-top:14px;line-height:1}
.badge-c{text-align:center;padding:11px 6px;border-radius:14px;background:var(--fond);opacity:.45}
.badge-c.ok{opacity:1;background:linear-gradient(180deg,#FFF7E9,#fff);box-shadow:inset 0 0 0 2px #F5DFAF}
.hist-l{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:13px;background:var(--fond);margin-bottom:6px}
.fete{position:fixed;inset:0;background:rgba(44,26,79,.55);display:grid;place-items:center;z-index:100;padding:20px;animation:fond .3s ease}
@keyframes fond{from{opacity:0}to{opacity:1}}
.fete-boite{background:#fff;border-radius:28px;padding:34px 30px;max-width:420px;width:100%;text-align:center;
  position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(40,15,90,.35);animation:surgit .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes surgit{from{opacity:0;transform:scale(.82) translateY(20px)}to{opacity:1;transform:none}}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:tombe 2.6s linear infinite}
@keyframes tombe{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(460px) rotate(540deg)}}
.gains{display:flex;gap:11px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.gain{background:var(--fond);border-radius:16px;padding:12px 17px;min-width:82px}
.gain b{display:block;font-family:'Fredoka';font-size:24px;color:var(--violet)}
.gain span{font-size:11px;font-weight:800;color:var(--doux)}
.promo{margin-top:14px;background:var(--vclair);color:var(--violet);border-radius:14px;padding:12px;font-size:13.5px;font-weight:700;line-height:1.5}
.resultat{margin-top:20px;padding:20px;border-radius:20px;background:var(--fond);animation:apparait .45s ease}
@keyframes apparait{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.act-vue{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--fond);margin-bottom:6px}
.act-edit{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.act-edit .ico{width:46px;text-align:center;font-size:18px;padding:9px 4px;border-radius:11px;border:2px solid var(--trait);background:#fff}
.act-edit .nom{flex:1;min-width:60px;padding:9px 12px;border-radius:11px;border:2px solid var(--trait);background:#fff;font-size:13.5px;font-weight:700}
.act-edit input[type=color]{width:40px;height:38px;border:2px solid var(--trait);border-radius:11px;background:#fff;padding:2px;cursor:pointer}
.act-edit .mini-b{width:34px;height:38px;border-radius:11px;border:1.5px solid var(--trait);background:#fff;color:var(--rouge);font-weight:800;display:grid;place-items:center}
.act-edit .mini-b:hover{border-color:var(--rouge)}
.cible{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:11px;
  font-size:13.5px;font-weight:700;color:var(--doux);margin-bottom:3px;border:2px solid transparent}
.cible:hover{background:var(--fond)}
.cible.a{background:var(--vclair);border-color:var(--violet);color:var(--violet)}
.cible.ok{color:var(--vert)}
.mini-av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Fredoka';
  font-size:12px;color:#fff;flex:none;overflow:hidden}
.mini-av img{width:100%;height:100%;object-fit:cover}
#viseur{position:absolute;border:3px solid #fff;border-radius:50%;pointer-events:none;display:none;
  box-shadow:0 0 0 2px var(--violet),0 0 0 9999px rgba(44,26,79,.35);transform:translate(-50%,-50%)}
body.sans-ia .ia-only{display:none!important}
.retour{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;background:var(--blanc);
  box-shadow:var(--ombre);font-weight:800;font-size:13.5px;color:var(--doux);margin-bottom:16px}
.retour:hover{color:var(--violet)}
.horloge{margin-top:auto;background:var(--fond);border-radius:16px;padding:13px;text-align:center;width:100%;display:block}
.horloge:hover{background:var(--vclair)}
.horloge .h{font-family:'Fredoka';font-size:25px;line-height:1;color:var(--violet)}
.horloge small{display:block;font-size:11px;font-weight:800;color:var(--doux);margin-top:4px}
.horloge .lbl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--pale);margin-bottom:5px}
.vue{margin-left:216px;flex:1;padding:28px 32px 80px;max-width:1500px}
/* Application installée : on respecte les encoches et la barre du bas */
@supports(padding:env(safe-area-inset-top)){
  .rail{padding-top:calc(20px + env(safe-area-inset-top))}
  .vue{padding-top:calc(28px + env(safe-area-inset-top))}
}
.titre{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.titre h1{font-size:28px}
.sstitre{color:var(--doux);font-weight:700;margin-bottom:20px;font-size:14.5px}
.carte{background:var(--blanc);border-radius:var(--r);box-shadow:var(--ombre);padding:20px}
.g{display:grid;gap:16px}
.ct{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ct h3{font-size:17px}
.tag{font-size:11px;font-weight:800;color:var(--doux);background:var(--fond);padding:5px 10px;border-radius:99px;white-space:nowrap}
.btn{padding:11px 18px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(123,77,224,.28)}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:wait}
.btn2{padding:8px 13px;border-radius:12px;background:var(--blanc);border:2px solid var(--trait);font-weight:800;font-size:12.5px;color:var(--doux)}
.btn2:hover{border-color:var(--violet);color:var(--violet)}
.btn2.on{background:var(--vclair);border-color:var(--violet);color:var(--violet)}
.champ{width:100%;padding:12px 15px;border-radius:13px;border:2px solid var(--trait);background:var(--blanc);font-size:14.5px;font-weight:600}
.champ::placeholder{color:var(--pale)}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.vide{text-align:center;padding:40px 22px;color:var(--pale);font-weight:700;line-height:1.6}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:17px}.stat .num{font-size:28px;line-height:1}
.stat small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--doux);margin-top:5px}
.skills{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.skill{text-align:center;padding:17px 12px}
.anneau{position:relative;width:96px;height:96px;margin:0 auto}
.anneau .v{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fredoka';font-size:31px}
.skill h4{font-size:15.5px;margin-top:10px}.skill .m{font-size:11.5px;font-weight:700;color:var(--pale)}
.pm{display:flex;gap:8px;justify-content:center;margin-top:10px}
.pm button{width:38px;height:38px;border-radius:12px;background:var(--fond);font-family:'Fredoka';font-size:19px;color:var(--violet);display:grid;place-items:center}
.pm button:hover{background:var(--vclair)}.pm button:active{transform:scale(.9)}
.pm button:disabled{opacity:.28;cursor:not-allowed}
.barre{height:9px;border-radius:9px;background:var(--trait);overflow:hidden}
.barre>span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--violet2))}
.ligne{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:700;font-size:14px}
.ligne .n{width:110px;flex:none;color:var(--doux)}.ligne .barre{flex:1}
.ligne .p{width:46px;text-align:right;font-family:'Fredoka';color:var(--violet)}
.notif{display:flex;gap:14px;align-items:flex-start;padding:15px 17px;border-radius:18px;background:var(--blanc);box-shadow:var(--ombre);margin-bottom:11px;border-left:5px solid var(--violet)}
.notif .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--fond)}
.notif h4{font-size:15.5px}
.notif p{font-size:13.5px;font-weight:600;color:var(--doux);line-height:1.5;margin-top:3px}
.notif .quand{font-size:11.5px;font-weight:800;color:var(--violet);margin-top:6px}
.notif .go{margin-left:auto;align-self:center}
.notif.urgent{border-left-color:var(--rouge)}.notif.urgent .quand{color:var(--rouge)}
.notif.ok{border-left-color:var(--vert)}.notif.ok .quand{color:var(--vert)}
.notif.info{border-left-color:var(--bleu)}.notif.info .quand{color:var(--bleu)}
.gd{grid-template-columns:repeat(auto-fill,minmax(198px,1fr))}
.fc{padding:14px;cursor:pointer;border:2px solid transparent;transition:.14s;position:relative}
.fc:hover{transform:translateY(-2px)}.fc.a{border-color:var(--violet)}
.fc.pris{background:linear-gradient(180deg,#F1FBF7,#fff)}.fc.pris .nom{color:var(--vert)}
.fc .em{font-size:25px}

/* ============================================================
   ██ 3. TEMPS DE PALIA
   ------------------------------------------------------------
   Source : wiki officiel. 1 journée en jeu = 1 heure réelle,
   1 heure en jeu = 2 min 30 réelles.
   Le compte se fait sur les minutes UTC (pas locales), sinon
   les fuseaux à demi-heure (Inde, Népal, Iran…) sont décalés.
     heure_jeu = (minutes UTC + secondes/60) × 24 / 60
   S.decal permet de recaler si jamais ça ne colle pas.
   ============================================================ */
function palia(){
  const d=new Date();
  let mr=d.getUTCMinutes()+d.getUTCSeconds()/60+(S&&S.decal?S.decal:0);
  mr=((mr%60)+60)%60;
  const t=mr*24/60,h=Math.floor(t),m=Math.floor((t-h)*60);
  return{h,m,mr,txt:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),periode:periodeDe(h)};}
// Matin 3h-6h · Jour 6h-18h · Soir 18h-21h · Nuit 21h-3h (wiki officiel)
function periodeDe(h){if(h>=3&&h<6)return'matin';if(h>=6&&h<18)return'jour';if(h>=18&&h<21)return'soir';return'nuit';}
function dansCombien(hJeu){return Math.round((hJeu*2.5-palia().mr+60)%60);}
function recaler(txt){                       // « il est 14:30 dans mon jeu » -> décalage
  const m=String(txt).match(/^(\d{1,2})\s*[:hH]\s*(\d{1,2})$/);if(!m)return false;
  const h=+m[1],mn=+m[2];if(h>23||mn>59)return false;
  const voulu=(h+mn/60)*2.5;
  const brut=new Date();
  const base=brut.getUTCMinutes()+brut.getUTCSeconds()/60;
  S.decal=Math.round(((voulu-base)%60+60)%60*10)/10;
  if(S.decal>30)S.decal-=60;
  save();return true;}
function dedans(h,[a,b]){return a<b?(h>=a&&h<b):(h>=a||h<b);}
const CODES={m:'matin',j:'jour',s:'soir',n:'nuit'};
function moments(e){if(!e.moment||e.moment==='T')return['toujours'];return e.moment.split('').map(c=>CODES[c]).filter(Boolean);}
function actif(e){const h=palia().h;return moments(e).some(p=>dedans(h,PERIODES[p].h));}
function prochaine(e){if(actif(e))return 0;return Math.min(...moments(e).map(p=>dansCombien(PERIODES[p].h[0])));}
function jourJardin(){return String(Math.floor((Date.now()-15*60000)/3600000));}
function jourPalia(){return String(Math.floor((Date.now()-7.5*60000)/3600000));}

async function ia(q,ctx=true,tok=900){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:enTetes(),
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:tok,system:SYSTEME,
      messages:[{role:"user",content:ctx?contexte()+'\n\nQUESTION : '+q:q}]})});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();return d.content.filter(x=>x.type==='text').map(x=>x.text).join('\n').trim();}
async function iaJSON(q,tok=2500){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:enTetes(),
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:tok,
      system:"Tu réponds UNIQUEMENT avec du JSON valide. Aucun texte avant ou après, aucune balise de code.",
      messages:[{role:"user",content:q}]})});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  const t=d.content.filter(x=>x.type==='text').map(x=>x.text).join('\n').replace(/```json|```/g,'').trim();
  return JSON.parse(t);}

function notifications(){
  const N=[];
  if(S.jardin.filter(Boolean).length){
    const prets=[],att=[];
    S.jardin.forEach(c=>{if(!c)return;const cu=CULTURES.find(x=>x.id===c.c);if(!cu)return;
      if(!cu.jours)return;
      const h=(Date.now()-c.t)/3600000;(h>=cu.jours?prets:att).push({cu,reste:Math.max(0,Math.round((cu.jours-h)*60))});});
    if(prets.length)N.push({t:'ok',ic:'🌾',titre:'Récolte prête',
      txt:`${prets.length} plante${prets.length>1?'s sont prêtes':' est prête'} : ${[...new Set(prets.map(x=>x.cu.nom))].join(', ')}.`,quand:'Va récolter',go:'jardin'});
    if(att.length){const p1=att.sort((a,b)=>a.reste-b.reste)[0];
      N.push({t:'info',ic:'🌱',titre:'Prochaine récolte',txt:`Ta ${p1.cu.nom.toLowerCase()} arrive bientôt.`,quand:'Dans '+dureeTxt(p1.reste),go:'jardin'});}
    if(S.arrose!==jourJardin()){const r=dansCombien(6);
      N.push({t:r<10?'urgent':'',ic:'💧',titre:'Tu as oublié d\'arroser',
        txt:'Tes plantes doivent être arrosées avant 6:00 en jeu, sinon la journée est perdue.',quand:'Il te reste '+dureeTxt(r),go:'jardin',action:'arrose'});}}
  /* Ranch */
  const jp=jourPalia();
  const aCaresser=ANIMAUX.filter(a=>S.ranch[a.n].nb>0&&Date.now()-S.ranch[a.n].caresse>=COOLDOWN_CARESSE);
  if(aCaresser.length)N.push({t:'ok',ic:'🤲',titre:'Tes animaux veulent des câlins',
    txt:`${aCaresser.map(a=>a.n).join(', ')} : les caresses ne comptent qu'une fois toutes les 17 heures réelles, ne les rate pas.`,
    quand:aCaresser.length+' espèce'+(aCaresser.length>1?'s':''),go:'elevage'});
  const aNourrir=ANIMAUX.filter(a=>S.ranch[a.n].nb>0&&S.ranch[a.n].nourri!==jp);
  if(aNourrir.length)N.push({t:'',ic:'🌽',titre:'Nourris tes animaux',
    txt:`${aNourrir.map(a=>a.n).join(', ')} n'${aNourrir.length>1?'ont':'a'} pas encore mangé aujourd'hui. Sans Concentration, la production ralentit.`,
    quand:'Remis à zéro à 3:00 en jeu',go:'elevage'});
  ['poissons','insectes','chasse'].forEach(t=>{
    listeGuide(t).filter(e=>S.fav[cleE(t,e)]&&!S.pris[cleE(t,e)]).forEach(e=>{
      const d=prochaine(e);
      if(d===0)N.push({t:'ok',ic:GUIDES[t].ic,titre:e.fr+' est là',
        txt:`Disponible maintenant · ${REGIONS[e.region]}${e.appat?' · appât : '+e.appat:''}${e.habitat?' · '+e.habitat:''}.`,quand:'C\'est le moment',go:t});
      else if(d<=15)N.push({t:'',ic:GUIDES[t].ic,titre:e.fr+' arrive',
        txt:`${moments(e).map(m=>PERIODES[m].nom.toLowerCase()).join(' et ')} · ${REGIONS[e.region]}.`,quand:'Dans '+dureeTxt(d),go:t});});});
  const env=[];HABITANTS.forEach(h=>{S.hab[h.n].envies.forEach(e=>{if(e.n&&!e.donne)env.push(h.n);});});
  const uniq=[...new Set(env)];
  if(uniq.length)N.push({t:'',ic:'🎁',titre:'Envies de la semaine',
    txt:`${uniq.slice(0,4).join(', ')}${uniq.length>4?` et ${uniq.length-4} autres`:''} attendent encore un cadeau.`,
    quand:uniq.length+' habitant'+(uniq.length>1?'s':''),go:'habitants'});
  const ap=HABITANTS.filter(h=>S.hab[h.n].coeurs>0&&S.hab[h.n].parle!==jp);
  if(ap.length)N.push({t:'info',ic:'💬',titre:'Parle-leur aujourd\'hui',
    txt:`${ap.length} habitant${ap.length>1?'s que tu connais n\'ont':' que tu connais n\'a'} pas encore eu sa discussion du jour.`,
    quand:'Remis à zéro à 3:00 en jeu',go:'habitants'});
  DEBLOCAGES.forEach(d=>{if(S.skills[d.sk]===d.n-1){const sk=SKILLS.find(x=>x.id===d.sk);
    N.push({t:'info',ic:'🔓',titre:'Tu y es presque',txt:`Encore 1 niveau de ${sk.nom} et tu débloques : ${d.quoi} (chez ${d.qui}).`,quand:`${sk.nom} ${S.skills[d.sk]} → ${d.n}`,go:'progression'});}});
  if(!N.length)N.push({t:'ok',ic:'✨',titre:'Tout est à jour',
    txt:'Rien d\'urgent. Plante quelque chose, mets un poisson en favori, ou fais tourner la roue.',quand:'Bon jeu !',go:'roue'});
  return N;}

/* ============================================================
   ██ MOTEUR ÉCONOMIQUE DU JARDIN
   Reproduit la chaîne du jeu : plantation → croissance → récolte
   → qualité → inventaire → choix → vente. Aucune pièce n'est
   comptée avant la vente.
   ============================================================ */
const DESTINATIONS={
  vendre:{n:'Vendre tel quel',e:'🪙',prix:c=>({N:c.prixN,E:c.prixE})},
  conserve:{n:'En conserves',e:'🫙',prix:c=>({N:c.conserve,E:Math.round(c.conserve*1.5)})},
  graine:{n:'En graines',e:'🌰',prix:c=>({N:c.graineFab,E:Math.round(c.graineFab*1.5)})},
  garder:{n:'Garder (cuisine, replanter)',e:'📦',prix:()=>({N:0,E:0})}};

// Ce que le terrain va réellement produire, buffs de voisinage compris
function productionTerrain(){
  const k=calculJardin(),T=S.taille,res={};
  S.jardin.forEach((c,i)=>{
    if(!c)return;const cu=CULTURES.find(x=>x.id===c.c);if(!cu)return;
    const bf=k.buffs[i];
    const r=res[cu.id]||(res[cu.id]={cu,cases:0,recolteBoost:0,qualiteBoost:0,pret:0});
    r.cases++;
    if(bf.has('recolte'))r.recolteBoost++;
    if(bf.has('qualite'))r.qualiteBoost++;
    const vit=bf.has('vitesse')?0.75:1;
    if(cu.jours>0&&(Date.now()-c.t)/3600000>=cu.jours*vit)r.pret++;});
  Object.values(res).forEach(r=>{
    const surf=r.cu.taille*r.cu.taille;
    r.plants=Math.max(1,Math.round(r.cases/surf));
    r.partBoost=r.cases?r.recolteBoost/r.cases:0;
    r.rendMoyen=r.cu.rend+(r.cu.rendB-r.cu.rend)*r.partBoost;
    r.parRecolte=Math.round(r.plants*r.rendMoyen);
    r.total=r.parRecolte*r.cu.rec;
    r.chanceEtoile=Math.min(100,(S.jrd.baseEtoile||5)+(r.cases?Math.round(r.qualiteBoost/r.cases*50):0));
    r.jours=r.cu.jours+(r.cu.rec-1)*r.cu.interv;
    r.coutGraines=r.plants*r.cu.graine;});
  return res;}

// Détail complet d'une vente, ligne par ligne
function detailVente(cu,normales,etoilees,dest,coutGraines,coutEngrais){
  const p=DESTINATIONS[dest].prix(cu);
  const vN=normales*p.N,vE=etoilees*p.E;
  const brut=vN+vE;
  return{normales,etoilees,total:normales+etoilees,pN:p.N,pE:p.E,vN,vE,brut,
    coutGraines,coutEngrais,net:brut-coutGraines-coutEngrais};}

function encaisser(id){
  const prod=productionTerrain(),r=prod[id];if(!r)return;
  const R=S.jrd,st=R.stock[id]||{n:null,e:null,dest:'vendre'};
  const auto=st.n===null;
  const et=auto?Math.round(r.total*r.chanceEtoile/100):(+st.e||0);
  const no=auto?r.total-et:(+st.n||0);
  const eng=(R.engrais[id]||0)*(R.prixEngrais||PRIX_ENGRAIS);
  const d=detailVente(r.cu,no,et,st.dest,r.coutGraines,eng);
  R.pieces=(R.pieces||0)+d.net;
  R.ventes.unshift({t:Date.now(),nom:r.cu.nom,e:r.cu.e,dest:st.dest,
    total:d.total,n:d.normales,et:d.etoilees,brut:d.brut,cout:d.coutGraines+d.coutEngrais,net:d.net});
  if(R.ventes.length>200)R.ventes.pop();
  // Le terrain se libère : les plants récoltés sont retirés
  S.jardin=S.jardin.map(c=>c&&c.c===id?null:c);
  delete R.stock[id];delete R.engrais[id];
  save();rendre();
  montrerToast(`💰 ${d.net.toLocaleString('fr-FR')} pièces encaissées`,null);}

let selParc=null;
function cible(base,diff){return Math.max(1,Math.round(base*MODES[diff].m));}
function etatParc(id){
  const P=PARCOURS[id],d=S.parc[id]||{p:0,diff:'M',c:{},or:0};
  const fini=d.p>=P.p.length;
  const pal=fini?null:P.p[d.p];
  let ok=false,total=0,faits=0;
  if(pal){
    total=pal.o.length+1;
    pal.o.forEach((o,i)=>{if((d.c[i]||0)>=cible(o[1],d.diff))faits++;});
    if((d.or||0)>=cible(pal.or,d.diff))faits++;
    ok=faits===total;}
  return{P,d,pal,fini,ok,faits,total};}
function validerPalier(id){
  const{P,d}=etatParc(id);
  d.p++;d.c={};d.or=0;
  if(!d.hist)d.hist=[];d.hist.push(Date.now());
  S.parc[id]=d;save();rendre();
  montrerToast(d.p>=P.p.length?`🏆 Parcours ${P.n} terminé !`:`✅ Palier ${d.p} de ${P.n} réussi !`,null);}

const ACTIVITES=[
  {id:'jardin',n:'Jardin',e:'🌱',c:'#2FB58A'},{id:'peche',n:'Pêche',e:'🎣',c:'#3A9BE0'},
  {id:'chasse',n:'Chasse',e:'🏹',c:'#C25B3A'},{id:'cuisine',n:'Cuisine',e:'🍳',c:'#F0A62F'},
  {id:'minage',n:'Minage',e:'⛏️',c:'#8B7BD8'},{id:'exploration',n:'Exploration',e:'🗺️',c:'#5FA0C0'},
  {id:'decoration',n:'Décoration',e:'🛋️',c:'#B85FD0'},{id:'insectes',n:'Insectes',e:'🦋',c:'#E8467C'},
  {id:'elevage',n:'Élevage',e:'🐔',c:'#E07BA8'},{id:'quetes',n:'Quêtes',e:'📜',c:'#E8843F'},
  {id:'autre',n:'Autre',e:'✨',c:'#7A8A9B'}];
const NIVEAUX=[{n:'Aucun jeu',c:'#EDE6FA'},{n:'Petite session',c:'#7FD6A4'},
  {n:'Session moyenne',c:'#F2C94C'},{n:'Grosse session',c:'#F2994A'},{n:'Très grosse session',c:'#9B6BF0'}];
const HUMEURS=['🤩','😊','😐','😕','😴'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const JOURS=['L','M','M','J','V','S','D'];

const cleJ=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const deCle=k=>{const[a,m,j]=k.split('-').map(Number);return new Date(a,m-1,j);};
function niveauAuto(min){if(!min)return 1;if(min<45)return 1;if(min<120)return 2;if(min<240)return 3;return 4;}
function niveauJour(j){return j?(j.niv||niveauAuto(j.min)):0;}
function dureeJ(min){if(!min)return '—';const h=Math.floor(min/60),m=min%60;
  return h?`${h} h${m?' '+String(m).padStart(2,'0'):''}`:`${m} min`;}

function series(){
  const cles=Object.keys(S.cal).sort();
  if(!cles.length)return{actuelle:0,record:0};
  let record=0,cour=0,prec=null;
  cles.forEach(k=>{const d=deCle(k);
    if(prec&&(d-prec)/86400000===1)cour++;else cour=1;
    if(cour>record)record=cour;prec=d;});
  // série en cours : doit toucher aujourd'hui ou hier
  const auj=new Date();auj.setHours(0,0,0,0);
  let actuelle=0,curseur=new Date(auj);
  if(!S.cal[cleJ(curseur)])curseur.setDate(curseur.getDate()-1);
  while(S.cal[cleJ(curseur)]){actuelle++;curseur.setDate(curseur.getDate()-1);}
  return{actuelle,record:Math.max(record,actuelle)};}

function statsCal(){
  const E=Object.entries(S.cal),s=series();
  const an=new Date().getFullYear();
  const cetteAnnee=E.filter(([k])=>+k.slice(0,4)===an).length;
  const minutes=E.reduce((a,[,v])=>a+(v.min||0),0);
  const pieces=E.reduce((a,[,v])=>a+(v.or||0),0);
  const cpt={};E.forEach(([,v])=>{if(v.act)cpt[v.act]=(cpt[v.act]||0)+1;});
  const top=Object.entries(cpt).sort((a,b)=>b[1]-a[1])[0];
  const act=top?ACTIVITES.find(a=>a.id===top[0]):null;
  return{...s,cetteAnnee,total:E.length,minutes,pieces,act,actN:top?top[1]:0};}

const BADGES_CAL=[
  ['s7','Une semaine','🔥','7 jours d\'affilée',s=>s.record>=7],
  ['s30','Un mois','🔥','30 jours d\'affilée',s=>s.record>=30],
  ['s100','Cent jours','🔥','100 jours d\'affilée',s=>s.record>=100],
  ['an','Une année','🏆','365 journées enregistrées',s=>s.total>=365],
  ['parfaite','Semaine parfaite','🏅','Une semaine entière du lundi au dimanche',()=>semaineParfaite()],
  ['h100','Cent heures','⏱️','100 heures de jeu enregistrées',s=>s.minutes>=6000],
  ['million','Millionnaire','💰','1 000 000 de pièces cumulées',s=>s.pieces>=1000000],
  ['varie','Touche-à-tout','🌈','Une session dans 7 activités différentes',
    ()=>new Set(Object.values(S.cal).map(v=>v.act).filter(Boolean)).size>=7]];
function semaineParfaite(){
  const cles=Object.keys(S.cal);
  for(const k of cles){const d=deCle(k),lun=new Date(d);
    lun.setDate(d.getDate()-((d.getDay()+6)%7));
    let ok=true;
    for(let i=0;i<7;i++){const x=new Date(lun);x.setDate(lun.getDate()+i);
      if(!S.cal[cleJ(x)]){ok=false;break;}}
    if(ok)return true;}
  return false;}

let toastMsg='',toastAction=null,toastT=null;
function montrerToast(msg,action){
  toastMsg=msg;toastAction=action||null;clearTimeout(toastT);
  toastT=setTimeout(()=>{toastMsg='';toastAction=null;rendre();},9000);
  rendre();}
function annulerToast(){if(toastAction){toastAction();}toastMsg='';toastAction=null;clearTimeout(toastT);rendre();}
let calAnnee=new Date().getFullYear(),calSel=null,calFiltre='tous',calAnime='',calToast='';

function grilleCal(){
  const debut=new Date(calAnnee,0,1),fin=new Date(calAnnee,11,31);
  const d0=new Date(debut);d0.setDate(debut.getDate()-((debut.getDay()+6)%7));
  const auj=cleJ(new Date());
  let cols=[],cur=new Date(d0),moisVus=[];
  while(cur<=fin||((cur.getDay()+6)%7)!==0){
    const col=[];
    for(let i=0;i<7;i++){
      const d=new Date(cur),k=cleJ(d);
      const dans=d.getFullYear()===calAnnee;
      const j=dans?S.cal[k]:null;
      let niv=niveauJour(j);
      if(j&&calFiltre!=='tous'&&j.act!==calFiltre)niv=0;
      col.push({k,d,dans,j,niv,auj:k===auj});
      cur.setDate(cur.getDate()+1);}
    moisVus.push(col[0].d.getMonth());
    cols.push(col);
    if(cur>fin&&((cur.getDay()+6)%7)===0)break;}
  return{cols,moisVus};}

function infoJour(x){
  const d=x.d,t=d.getDate()+' '+MOIS[d.getMonth()];
  if(!x.j)return t+'\nPas de session enregistrée';
  const a=ACTIVITES.find(y=>y.id===x.j.act);
  return t+'\n'+[x.j.min?'Durée : '+dureeJ(x.j.min):null,
    a?'Activité : '+a.e+' '+a.n:null,
    x.j.or?'Pièces : '+x.j.or.toLocaleString('fr-FR'):null,
    x.j.hum?'Humeur : '+x.j.hum:null,
    x.j.note?'« '+x.j.note+' »':null].filter(Boolean).join('\n');}

function partPath(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
  const[x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;}

  else{corps=A.map((a,i)=>`<path d="${partPath(C,C,R,i*seg,(i+1)*seg)}" fill="${a.c}" stroke="#fff" stroke-width="2.5"/>`).join('');}
  const etiquettes=A.map((a,i)=>{
    const mid=i*seg+seg/2,petit=N>10;

  return `<svg viewBox="0 0 400 400" style="width:100%;max-width:400px;display:block;margin:0 auto">
    <g id="roue-g" style="transform-origin:200px 200px;transform:rotate(${rouePos}deg)">
      ${corps}${etiquettes}</g>

    <text x="${C}" y="${C+8}" text-anchor="middle" font-size="24">🎯</text>
    <path d="M200 6 L214 40 L186 40 Z" fill="#2C1A4F"/>
  </svg>`;}

let brouillons={};
function lireChamps(pre,t,plus){const v={};
  champsDe(t,plus).forEach(c=>{const e=$('#'+pre+'-'+c.id);if(e)v[c.id]=e.value.trim();});return v;}

function ajouterElement(quoi){
  const t = quoi==='gd' ? vue : quoi;
  const v = lireChamps(quoi,t,false);
  if(!v.n){alert('Il faut au moins un nom.');return;}

  if(t==='hab'){
    if(HABITANTS.some(x=>x.n===v.n)){alert('Ce personnage existe déjà.');return;}
    const cs=['#7B4DE0','#2FB58A','#3A9BE0','#F0A62F','#E8467C','#C25B3A','#6FBF3F','#B85FD0'];
    const h={n:v.n,l:v.l||'Autre',r:v.r||'À découvrir',c:cs[HABITANTS.length%cs.length],perso:1};
    HABITANTS.push(h);S.habSup.push(h);S.hab[v.n]=habVide(h);selHab=v.n;}

  else if(t==='anm'){
    if(ANIMAUX.some(x=>x.n===v.n)){alert('Cet animal existe déjà.');return;}
    const a={n:v.n,e:v.e||'🐾',prod:v.p||'—',cout:v.c||'—',niv:0,perso:1,
      ou:'Ajouté par toi.',besoin:'Nourriture et caresses, comme les autres.',
      donne:v.p||'—',astuce:'Complète cette fiche quand tu en sauras plus.'};
    ANIMAUX.push(a);S.animSup.push(a);S.ranch[v.n]={nb:0,caresse:0,nourri:''};selAn=ANIMAUX.length-1;}

  else if(t==='cul'){
    const id='p'+Date.now().toString(36);
    const c={id,nom:v.n,e:v.e||'🌿',b:v.b||'eau',jours:Math.max(1,+v.j||5),rec:1,interv:0,rend:2,rendB:3,
      prixN:Math.max(0,+v.p||0),prixE:Math.round(Math.max(0,+v.p||0)*1.5),graine:0,
      conserve:Math.round(Math.max(0,+v.p||0)*1.5),graineFab:Math.max(0,+v.p||0),taille:1,perso:1};
    CULTURES.push(c);S.cultSup.push(c);selPlante=id;}


  else if(t==='out'){
    if(listeOutils().some(x=>sansAccent(x.nom)===sansAccent(v.n))){alert('Cet outil existe déjà.');return;}
    S.outSup.push([v.n,v.cat||'machine','À compléter',v.pnj||'—',+v.niv||1,'À compléter','À compléter']);
    selOut=sansAccent(v.n);}

  else if(t==='meub'){
    if(listeMeub().some(x=>sansAccent(x.n)===sansAccent(v.n))){alert('Ce meuble existe déjà.');return;}
    S.meubSup.push([v.n,v.col||'Perso',v.cat||'Autres',v.taille||'1×1','À compléter',0,0,'À compléter','Établi',1,'—',1]);
    selMeub=MEUBLES.length+S.meubSup.length-1;}

  else if(t==='res'){
    if(listeRes().some(x=>sansAccent(x.n)===sansAccent(v.n))){alert('Cette ressource existe déjà.');return;}
    S.resSup.push([v.n,v.cat||'autre',v.reg||'K','À compléter','Aucun',1,0,0,'À compléter']);
    selRes=RESSOURCES.length+S.resSup.length-1;}

  else if(t==='obj'){
    if(OBJETS.concat(S.sup).some(x=>x.n===v.n)){alert('Cet objet existe déjà.');return;}
    S.sup.push({n:v.n,e:v.e||'📦',c:v.c||'Autres',perso:1});S.inv[v.n]=1;}

  else if(t==='rec'){
    if(toutesRec().some(x=>x[0]===v.n)){alert('Cette recette existe déjà.');return;}
    S.recSup.push({fr:v.n,en:v.n,st:v.st||'C',pas:1,xp:0,foc:0,prix:0,rar:'C'});
    selR=toutesRec().length-1;}

  else{
    const en=v.e||v.n;
    if(GUIDES[t].data.some(x=>x[0]===en||x[1]===v.n)){alert('Cet élément existe déjà.');return;}
    const reg=v.reg||'K',rar=v.rar||'C',mom=v.mom||'T';
    const e = t==='poissons' ? [en,v.n,reg,'À compléter','A',mom,rar,0,1]
            : t==='insectes' ? [en,v.n,reg,'À compléter',mom,rar,0,1]
                             : [en,v.n,reg,'À compléter','T',rar,'À compléter',1];
    GUIDES[t].data.push(e);S.gSup[t].push(e);selG=GUIDES[t].data.length-1;}

  brouillons[quoi]=null;
  save();rendre();window.scrollTo({top:0,behavior:'smooth'});}

let editT='',editK='';
function objPerso(t,k){
  if(t==='hab')return HABITANTS.find(x=>x.n===k);
  if(t==='anm')return ANIMAUX.find(x=>x.n===k);
  if(t==='cul')return CULTURES.find(x=>x.id===k);
  if(t==='out')return (S.outSup||[]).find(x=>x[0]===k);
  if(t==='meub')return (S.meubSup||[]).find(x=>x[0]===k);
  if(t==='res')return (S.resSup||[]).find(x=>x[0]===k);
  if(t==='obj')return S.sup.find(x=>x.n===k);
  if(t==='rec')return S.recSup.find(x=>x.en===k);
  return GUIDES[t]?GUIDES[t].data.find(x=>x[0]===k):null;}
function valsDe(t,o){
  if(!o)return{};
  if(t==='hab')return{n:o.n,r:o.r,l:o.l};
  if(t==='anm')return{n:o.n,p:o.prod,e:o.e,c:o.cout,ou:o.ou,bes:o.besoin,ast:o.astuce};
  if(t==='cul')return{n:o.nom,e:o.e,b:o.b,j:o.jours,p:o.prixN};
  if(t==='out')return{n:o[0],cat:o[1],ou:o[2],pnj:o[3],niv:o[4],mats:o[5],desc:o[6]};
  if(t==='meub')return{n:o[0],col:o[1],cat:o[2],taille:o[3],ou:o[4],prix:o[6],ress:o[7],etabli:o[8],niv:o[9],plan:o[10]};
  if(t==='res')return{n:o[0],cat:o[1],reg:o[2],ou:o[3],outil:o[4],niv:o[5],prixN:o[6],prixE:o[7],usage:o[8]};
  if(t==='obj')return{n:o.n,e:o.e,c:o.c};
  if(t==='rec')return{n:o.fr,st:o.st};
  if(t==='poissons')return{n:o[1],e:o[0],reg:o[2],mom:o[5],rar:o[6],eau:o[3],app:o[4],prix:o[7]};
  if(t==='insectes')return{n:o[1],e:o[0],reg:o[2],mom:o[4],rar:o[5],hab:o[3],prix:o[6]};
  return{n:o[1],e:o[0],reg:o[2],rar:o[5],met:o[3],but:o[6]};}

function majEdit(){
  const o=objPerso(editT,editK);if(!o)return;
  const v=lireChamps('ed',editT,true);
  if(!v.n)return;                       // on ne touche à rien tant que le nom est vide
  appliquerEdit(o,v);save();
  if(editT==='hab'||editT==='obj'||editT==='anm')editK=v.n;
  else if(editT!=='cul'&&editT!=='rec'&&CHAMPS[editT])editK=o[0];}

function appliquerEdit(o,v){
  const t=editT;
  if(t==='hab'){const anc=o.n;o.n=v.n;o.r=v.r;o.l=v.l;
    if(anc!==v.n){S.hab[v.n]=S.hab[anc]||habVide(o);delete S.hab[anc];
      if(PH[anc]){PH[v.n]=PH[anc];delete PH[anc];savePhotos();}
      const i=S.habSup.findIndex(x=>x.n===anc);if(i>=0)S.habSup[i]=o;selHab=v.n;}}
  else if(t==='anm'){const anc=o.n;o.n=v.n;o.prod=v.p;o.e=v.e||o.e;o.cout=v.c;
    o.ou=v.ou||o.ou;o.besoin=v.bes||o.besoin;o.astuce=v.ast||o.astuce;o.donne=v.p||o.donne;
    if(anc!==v.n){S.ranch[v.n]=S.ranch[anc]||{nb:0,caresse:0,nourri:''};delete S.ranch[anc];
      if(PH['a:'+anc]){PH['a:'+v.n]=PH['a:'+anc];delete PH['a:'+anc];savePhotos();}}}
  else if(t==='cul'){o.nom=v.n;o.e=v.e||o.e;o.b=v.b;o.jours=Math.max(1,+v.j||o.jours);
    o.prixN=Math.max(0,+v.p||0);o.prixE=Math.round(o.prixN*1.5);o.conserve=o.prixE;o.graineFab=o.prixN;}

  else if(t==='out'){o[0]=v.n;o[1]=v.cat;o[2]=v.ou||o[2];o[3]=v.pnj;o[4]=+v.niv||1;
    o[5]=v.mats||o[5];o[6]=v.desc||o[6];}
  else if(t==='meub'){o[0]=v.n;o[1]=v.col;o[2]=v.cat;o[3]=v.taille;o[4]=v.ou||o[4];
    o[5]=+v.prix?1:0;o[6]=+v.prix||0;o[7]=v.ress||o[7];o[8]=v.etabli||o[8];o[9]=+v.niv||o[9];o[10]=v.plan||o[10];}
  else if(t==='res'){o[0]=v.n;o[1]=v.cat;o[2]=v.reg;o[3]=v.ou||o[3];o[4]=v.outil||o[4];
    o[5]=+v.niv||o[5];o[6]=+v.prixN||0;o[7]=+v.prixE||0;o[8]=v.usage||o[8];}
  else if(t==='obj'){const anc=o.n;o.n=v.n;o.e=v.e||o.e;o.c=v.c;
    if(anc!==v.n){S.inv[v.n]=S.inv[anc]||0;delete S.inv[anc];}}
  else if(t==='rec'){o.fr=v.n;o.st=v.st;}
  else if(t==='poissons'){o[1]=v.n;o[2]=v.reg;o[3]=v.eau||o[3];o[4]=v.app||o[4];o[5]=v.mom;o[6]=v.rar;o[7]=+v.prix||0;}
  else if(t==='insectes'){o[1]=v.n;o[2]=v.reg;o[3]=v.hab||o[3];o[4]=v.mom;o[5]=v.rar;o[6]=+v.prix||0;}
  else if(t==='chasse'){o[1]=v.n;o[2]=v.reg;o[3]=v.met||o[3];o[5]=v.rar;o[6]=v.but||o[6];}}

function enregistrerEdit(){

  const v=lireChamps('ed',editT,true);
  if(!v.n){alert('Le nom ne peut pas être vide.');return;}

    ranch:t==='anm'?JSON.parse(JSON.stringify(S.ranch[k]||{})):null,

  else if(t==='cul'){const i=CULTURES.findIndex(x=>x.id===k);if(i>=0)CULTURES.splice(i,1);
    S.cultSup=S.cultSup.filter(x=>x.id!==k);
    S.jardin=S.jardin.map(x=>x&&x.c===k?null:x);
    selPlante=CULTURES[0]?CULTURES[0].id:'';}
  else if(t==='out'){S.outSup=S.outSup.filter(x=>x[0]!==k);delete S.out[k];selOut=null;}
  else if(t==='meub'){S.meubSup=S.meubSup.filter(x=>x[0]!==k);delete S.meub[k];selMeub=null;}
  else if(t==='res'){S.resSup=S.resSup.filter(x=>x[0]!==k);delete S.res[k];selRes=null;}
  else if(t==='obj'){S.sup=S.sup.filter(x=>x.n!==k);delete S.inv[k];}
  else if(t==='rec'){S.recSup=S.recSup.filter(x=>x.en!==k);delete S.ing[k];delete S.cuisine[k];selR=null;}
  else{const i=GUIDES[t].data.findIndex(x=>x[0]===k);if(i>=0)GUIDES[t].data.splice(i,1);
    S.gSup[t]=S.gSup[t].filter(x=>x[0]!==k);
    delete S.pris[t+':'+k];delete S.fav[t+':'+k];selG=null;}
  editT='';editK='';save();rendre();
  montrerToast('« '+nom+' » supprimé',()=>{
    if(t==='hab'){HABITANTS.push(sauve.o);S.habSup.push(sauve.o);S.hab[k]=sauve.hab;}
    else if(t==='anm'){ANIMAUX.push(sauve.o);S.animSup.push(sauve.o);S.ranch[k]=sauve.ranch;}
    else if(t==='cul'){CULTURES.push(sauve.o);S.cultSup.push(sauve.o);S.jardin=sauve.jardin;}
    else if(t==='obj'){S.sup.push(sauve.o);S.inv[k]=sauve.inv;}
    else if(t==='rec'){S.recSup.push(sauve.o);if(sauve.ing&&sauve.ing.length)S.ing[k]=sauve.ing;}
    else{GUIDES[t].data.push(sauve.o);S.gSup[t].push(sauve.o);
      if(sauve.pris)S.pris[t+':'+k]=sauve.pris;if(sauve.fav)S.fav[t+':'+k]=sauve.fav;}
    if(sauve.photo)savePhotos();
    save();});}

function tournerRoue(){
  const A=S.roue,N=A.length;
  if(roueTourne||!N)return;
  roueTourne=true;roueRes=null;rendre();
  const seg=360/N,i=Math.floor(Math.random()*N);
  const voulu=(360-(i*seg+seg/2)+360)%360;
  const delta=(voulu-(rouePos%360)+360)%360;
  rouePos+=360*5+delta;
  const g=document.getElementById('roue-g');
  if(g){g.style.transition='transform 4.4s cubic-bezier(.13,.85,.16,1)';
    requestAnimationFrame(()=>{g.style.transform=`rotate(${rouePos}deg)`;});}
  setTimeout(()=>{roueRes=A[i];roueTourne=false;save();rendre();},4500);}

/* ============================================================
   ██ DÉTECTION AUTOMATIQUE DES VISAGES
   Les captures de suivi ont un fond très clair et des portraits
   ronds colorés, tous de la même taille. On repère les taches de
   couleur carrées et de taille comparable, puis on les trie dans
   l'ordre de lecture. L'IA lit ensuite les noms sur l'image.
   ============================================================ */
function detecterVisages(img){
  const L=900,ech=Math.min(1,L/img.naturalWidth);
  const W=Math.round(img.naturalWidth*ech),H=Math.round(img.naturalHeight*ech);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data;

  const P=2,gw=Math.floor(W/P),gh=Math.floor(H/P);   // grille échantillonnée
  const plein=new Uint8Array(gw*gh);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
    const i=((gy*P)*W+gx*P)*4,r=d[i],v=d[i+1],b=d[i+2];
    const mx=Math.max(r,v,b),mn=Math.min(r,v,b);
    const lum=mx/255, sat=mx?(mx-mn)/mx:0;
    plein[gy*gw+gx]=(lum<0.90||sat>0.13)?1:0;        // 0 = fond clair
  }
  // composantes connexes
  const vu=new Int32Array(gw*gh).fill(-1),blobs=[],pile=new Int32Array(gw*gh);
  for(let s=0;s<gw*gh;s++){
    if(!plein[s]||vu[s]>=0)continue;
    let t=0;pile[t++]=s;vu[s]=blobs.length;
    let x0=1e9,y0=1e9,x1=-1,y1=-1,n=0;
    while(t){const c=pile[--t],cxx=c%gw,cyy=(c/gw)|0;n++;
      if(cxx<x0)x0=cxx;if(cxx>x1)x1=cxx;if(cyy<y0)y0=cyy;if(cyy>y1)y1=cyy;
      for(let k=0;k<4;k++){
        const nx=cxx+(k===0?1:k===1?-1:0),ny=cyy+(k===2?1:k===3?-1:0);
        if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
        const j=ny*gw+nx;if(plein[j]&&vu[j]<0){vu[j]=blobs.length;pile[t++]=j;}}}
    blobs.push({x0,y0,x1,y1,n});
  }
  // filtrage : à peu près carré, bien rempli
  let cand=blobs.map(b=>{const w=b.x1-b.x0+1,h=b.y1-b.y0+1;
    return{w,h,ratio:w/h,rempli:b.n/(w*h),cx:(b.x0+b.x1)/2,cy:(b.y0+b.y1)/2};})
    .filter(b=>b.w>12&&b.ratio>0.72&&b.ratio<1.4&&b.rempli>0.5);
  if(!cand.length)return[];
  // on garde le groupe des plus gros (les portraits), pas les petites icônes
  const maxW=Math.max(...cand.map(b=>b.w));
  cand=cand.filter(b=>b.w>maxW*0.55);
  // ordre de lecture
  const hMoy=cand.reduce((a,b)=>a+b.h,0)/cand.length;
  cand.sort((a,b)=>Math.abs(a.cy-b.cy)>hMoy*0.6?a.cy-b.cy:a.cx-b.cx);
  return cand.map(b=>({
    x:(b.cx*P)/W, y:(b.cy*P)/H,                      // centre, en fraction
    t:(Math.max(b.w,b.h)*P)/W                        // côté, en fraction de largeur
  }));}

function couperEn(px,py,cote){
  const s=Math.max(8,cote*IMGOBJ.naturalWidth);
  let sx=px*IMGOBJ.naturalWidth-s/2, sy=py*IMGOBJ.naturalHeight-s/2;
  sx=Math.max(0,Math.min(IMGOBJ.naturalWidth-s,sx));
  sy=Math.max(0,Math.min(IMGOBJ.naturalHeight-s,sy));
  const c=document.createElement('canvas');c.width=c.height=128;
  c.getContext('2d').drawImage(IMGOBJ,sx,sy,s,s,0,0,128,128);
  return c.toDataURL('image/jpeg',0.85);}

let autoRes=[],autoEtat='',autoBilan=null;
function chercheDans(T,s1){
  return T.find(x=>sansAccent(x.n)===s1)
      || T.find(x=>sansAccent(x.n).replace(/s$/,'')===s1.replace(/s$/,''))
      || (s1.length>=5?T.find(x=>sansAccent(x.n).startsWith(s1.slice(0,5))):null)
      || null;}
// On cherche dans la catégorie choisie, et seulement en dernier recours ailleurs
function chercherCible(nom){
  const s1=sansAccent(nom);if(!s1)return null;
  return chercheDans(ciblesPhotos(),s1) || chercheDans(toutesCibles(),s1);}

  autoEtat='Je lis les noms…';rendre();

  let noms=[];
  try{

    cv.width=IMGOBJ.naturalWidth*e;cv.height=IMGOBJ.naturalHeight*e;
    cv.getContext('2d').drawImage(IMGOBJ,0,0,cv.width,cv.height);
    const b64=cv.toDataURL('image/jpeg',0.8).split(',')[1];
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:enTetes(),
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:900,
        system:"Tu réponds UNIQUEMENT avec du JSON valide, sans texte ni balise autour.",

          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
          {type:"text",text:`Capture du jeu Palia. Chaque image (personnage, poisson, insecte, animal, plat, objet ou plante) porte un nom.
Donne la liste des noms dans l'ordre de lecture, en tableau JSON de chaînes. Rien d'autre.`}]}]})});
    if(r.ok){const j=await r.json();
      const t=j.content.filter(x=>x.type==='text').map(x=>x.text).join('').replace(/```json|```/g,'').trim();
      const a=JSON.parse(t);if(Array.isArray(a))noms=a.map(String);}

  // Rangement automatique, toutes catégories confondues
  let ranges=0;const restants=[];

  autoRes=restants;
  autoEtat='pret';rendre();}

/* ---------- RECETTES ---------- */
function vRecettes(){
  let L=toutesRec().map((_,i)=>lireRec(i));
  const total=L.length, faisables=L.filter(r=>etatRecette(r).code==='ok').length;
  const remplies=L.filter(r=>r.ing&&r.ing.length).length;
  const cuites=L.filter(r=>S.cuisine[r.en]).length;
  if(rechR){const q=rechR.toLowerCase();
    L=L.filter(r=>(r.fr+' '+r.en+' '+(r.ing||[]).map(x=>x.n).join(' ')).toLowerCase().includes(q));}
  if(fSt!=='tous')L=L.filter(r=>r.st===fSt);
  if(fRec==='faisable')L=L.filter(r=>etatRecette(r).code==='ok');
  if(fRec==='manque')L=L.filter(r=>etatRecette(r).code==='no');
  if(fRec==='afaire')L=L.filter(r=>!S.cuisine[r.en]);
  if(fRec==='vide')L=L.filter(r=>!r.ing||!r.ing.length);
  L.sort((a,b)=>a.pas-b.pas);
  const sel=selR!=null?lireRec(selR):null;
  return `
  <div class="titre"><h1>Mes recettes</h1><span class="tag">${total} recettes</span>
    ${faisables?`<span class="tag" style="background:#E6F8F1;color:var(--vert)">${faisables} faisables maintenant</span>`:''}</div>
  <div class="sstitre">L'app compare les ingrédients avec ton inventaire et te dit ce que tu peux cuisiner.</div>

  <div class="carte" style="margin-bottom:16px">
    <div class="ct" style="margin-bottom:10px"><h3>Déjà cuisinées</h3><span class="tag">${cuites} / ${total}</span></div>
    <div class="barre" style="height:13px"><span style="width:${cuites/total*100}%"></span></div>
    ${remplies<total?`<div style="margin-top:14px;background:#FFF7E9;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:200px;font-size:13.5px;font-weight:700;color:#8A5A12;line-height:1.5">
        ${remplies} recettes sur ${total} ont leurs ingrédients renseignés. L'assistant peut remplir le reste d'un coup.</div>
      <button class="btn ia-only" id="fill-ing">Compléter les ingrédients</button></div>`:''}
  </div>

  <div class="carte" style="margin-bottom:16px">
    <div class="ct" style="margin-bottom:10px"><h3>Ajouter une recette</h3><span class="tag">${S.recSup.length} perso</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${rendreChamps('rec','rec',false,brouillons['rec'])}
      <button class="btn" data-ajout="rec">Ajouter</button>
      ${btnPhotos('rec')}</div>
    <p style="font-size:12.5px;font-weight:600;color:var(--doux);margin-top:9px;line-height:1.5">
      Pour une recette que le jeu vient d'ajouter, ou une que tu inventes. Ensuite, remplis ses ingrédients dans sa fiche.</p>
  </div>

  <div class="carte" style="margin-bottom:16px">
    <input class="champ" id="rr" value="${esc(rechR)}" placeholder="Chercher une recette ou un ingrédient…" style="margin-bottom:12px">
    <div class="puces" style="margin-bottom:8px">
      ${[['tous','Tout'],['faisable','Je peux la faire'],['manque','Il me manque peu'],['afaire','Jamais cuisinée'],['vide','Ingrédients à remplir']]
        .map(([k,l])=>`<button class="btn2 ${fRec===k?'on':''}" data-frc="${k}">${l}</button>`).join('')}</div>
    <div class="puces">
      <button class="btn2 ${fSt==='tous'?'on':''}" data-fst="tous">Tous les postes</button>
      ${Object.entries(STATIONS).map(([k,s])=>`<button class="btn2 ${fSt===k?'on':''}" data-fst="${k}">${s.e} ${s.n}</button>`).join('')}</div>
  </div>

  ${sel?detailRec(sel):''}

  ${L.length?`<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(268px,1fr))">
    ${L.map(r=>{const et=etatRecette(r);
      return `<div class="carte rec ${selR===r.i?'a':''} ${et.code==='ok'?'faisable':''}" data-rec="${r.i}">
        <button class="coche" data-cuit="${r.i}" title="Déjà cuisinée">${S.cuisine[r.en]?chk:''}</button>
        <div style="text-align:center;padding-top:4px">
          <div>${vign('r:'+r.en,STATIONS[r.st].e,46)}</div>
          <div class="nom">${esc(r.fr)}</div><div class="en">${esc(r.en)}</div></div>
        <div class="meta">${STATIONS[r.st].n} · ${r.pas} étape${r.pas>1?'s':''}</div>
        <div class="meta">⭐ ${r.xp} XP · 🧠 ${r.foc} · 💰 ${r.prix}+</div>
        ${r.ing&&r.ing.length?`<div class="ings">${r.ing.map(x=>{const ok=(S.inv[x.n]||0)>=x.q;
          return `<span class="ing ${ok?'ok':'ko'}">${PH['o:'+x.n]?`<img src="${PH['o:'+x.n]}" style="width:13px;height:13px;border-radius:3px;object-fit:cover;vertical-align:-2px;margin-right:3px">`:''}${esc(x.n)} ×${x.q}</span>`}).join('')}</div>`:''}
        <div class="etat ${et.code==='ok'?'now':(et.code==='no'?'soon':'later')}">${et.txt}</div>
      </div>`}).join('')}</div>`
    :'<div class="carte"><div class="vide">Aucune recette avec ces filtres.</div></div>'}`;}

function detailRec(r){

  return `<div class="detail">
    <div class="carte">
      <div style="text-align:center"><div>${vign('r:'+r.en,STATIONS[r.st].e,96)}</div>

      <div style="margin-top:14px">
        <div class="info"><span>Où la cuisiner</span><span>${STATIONS[r.st].n}</span></div>
        <div class="info"><span>Étapes</span><span>${r.pas}</span></div>

        <button class="btn2" data-fermer-rec="1" style="padding:12px 15px">Fermer</button>
        ${btnImg('r:'+r.en)}

    </div>
    <div class="carte">
      <div class="ct"><h3>Ingrédients</h3>

      ${r.ing&&r.ing.length?`
        <div>${r.ing.map((x,j)=>{const ai=S.inv[x.n]||0,ok=ai>=x.q;
          return `<div class="ligne-ing ${ok?'ok':''}">

            <button class="mini-b" data-res-nom="${esc(x.n)}" title="Voir sa fiche">🔗</button>

        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn2" data-ingplus="${r.i}">+ Ligne</button>

        <div style="margin-top:14px;padding:13px;border-radius:14px;background:${et.code==='ok'?'#EAF9F3':'var(--fond)'};
          font-size:14px;font-weight:800;color:${et.code==='ok'?'var(--vert)':'var(--doux)'}">
          ${et.code==='ok'?'✓ Tu as tout ce qu\'il faut, va cuisiner !':'Il te manque : '+et.manque.map(m=>m.n+' ×'+(m.q-(S.inv[m.n]||0))).join(', ')}</div>`
      :'<div class="vide">Clique sur « Demander » : l\'assistant écrit la liste des ingrédients, que tu pourras corriger.</div>'}
    </div></div>`;}

/* ---------- HABITANTS ---------- */
function vHabitants(){
  const jp=jourPalia();
  let L=HABITANTS.slice();
  if(rechH)L=L.filter(h=>h.n.toLowerCase().includes(rechH.toLowerCase()));
  if(fHab==='romance')L=L.filter(h=>ROMANCE.includes(h.n));
  if(fHab==='afaire')L=L.filter(h=>S.hab[h.n].envies.some(e=>e.n&&!e.donne)||S.hab[h.n].parle!==jp);
  if(fHab==='amis')L=L.filter(h=>S.hab[h.n].coeurs>0);
  const enAttente=HABITANTS.filter(h=>S.hab[h.n].envies.some(e=>e.n&&!e.donne)).length;
  const totalEnv=HABITANTS.reduce((a,h)=>a+S.hab[h.n].envies.filter(e=>e.n).length,0);
  const donnes=HABITANTS.reduce((a,h)=>a+S.hab[h.n].envies.filter(e=>e.n&&e.donne).length,0);
  return `
  <div class="titre"><h1>Les habitants</h1>
    <span class="tag">${HABITANTS.reduce((a,h)=>a+S.hab[h.n].coeurs,0)}/${HABITANTS.length*4} cœurs</span>
    ${totalEnv?`<span class="tag" style="background:#E6F8F1;color:var(--vert)">${donnes}/${totalEnv} envies offertes</span>`:''}</div>
  <div class="sstitre">Clique sur ＋ à côté d'un visage pour mettre sa vraie image depuis ton ordinateur.</div>
  <div class="carte" style="margin-bottom:16px">
    <input class="champ" id="rh" value="${esc(rechH)}" placeholder="Chercher un habitant…" style="margin-bottom:12px">
    <div class="puces">
      ${[['tous','Tous ('+HABITANTS.length+')'],['afaire','À faire ('+enAttente+')'],['amis','Mes amis'],['romance','Romance']]
        .map(([k,l])=>`<button class="btn2 ${fHab===k?'on':''}" data-fh="${k}">${l}</button>`).join('')}
      <button class="btn2" id="new-semaine">Nouvelle semaine</button>
      ${btnPhotos('hab')}</div></div>
  ${barreAjout('hab','hab','Ajouter un habitant')}
  <div class="hgrid">${L.map(h=>carteHab(h,jp)).join('')||'<div class="carte"><div class="vide">Personne ne correspond.</div></div>'}</div>
  ${selHab?`<div style="margin-top:20px">${ficheHab(HABITANTS.find(x=>x.n===selHab))}</div>`:''}`;}

function carteHab(h,jp){
  const d=S.hab[h.n],rom=ROMANCE.includes(h.n);
  const fini=d.envies.filter(e=>e.n).length>0&&d.envies.every(e=>!e.n||e.donne);
  return `<div class="hc ${fini?'fini':''}">
    <div class="haut">${avatar(h,58)}
      <div style="min-width:0">
        <h3>${esc(h.n)} <button data-oeil="${esc(h.n)}" title="Voir sa fiche" style="font-size:14px;opacity:.5">👁</button>${h.perso?`<button data-edit="hab" data-cle="${esc(h.n)}" title="Modifier" style="font-size:13px;opacity:.5">✏️</button>`:''}</h3>
        <div class="role">${h.r}</div></div>
      <div class="lieu-b">📍<select data-lieu="${esc(h.n)}">
        ${LIEUX.map(l=>`<option ${d.lieu===l?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="actions">
      ${rom?`<button data-rom="${esc(h.n)}" class="${d.rom>0?'on':''}" title="Niveau de romance">💗</button>`:''}
      <button data-parle="${esc(h.n)}" class="${d.parle===jp?'on':''}" title="Lui parler aujourd'hui">💬</button>
      <button data-cadeaujour="${esc(h.n)}" class="${d.cadeauJour===jp?'on':''}" title="Cadeau du jour donné">🎁</button></div>
    <div class="bloc"><div class="tt">🕐 Cadeau du jour</div>
      <div class="dg">
        <input list="tousobjets" data-cadtxt="${esc(h.n)}" value="${esc(d.cadeauTxt)}" placeholder="Quel cadeau lui donner ?">
        <button data-cadeaujour="${esc(h.n)}" class="${d.cadeauJour===jp?'on':''}">${d.cadeauJour===jp?chkV:'🎒'}</button></div>
      <button class="lien" data-likes="${esc(h.n)}">Voir tout ce qu'il aime →</button></div>
    <div class="bloc"><div class="tt">📅 Envies de la semaine</div>
      ${d.envies.map((e,i)=>`<div class="wl ${e.donne?'donne':''}">
        <input list="tousobjets" data-env="${esc(h.n)}" data-i="${i}" value="${esc(e.n)}" placeholder="Envie ${i+1}…">
        <button class="coeur ${e.aime?'on':''}" data-aime="${esc(h.n)}" data-i="${i}" title="Il adore">${coeurSVG(e.aime,14)}</button>
        <button class="mini-b ${e.donne?'on':''}" data-donne="${esc(h.n)}" data-i="${i}" title="Offert">${e.donne?chkV:'🎁'}</button>
      </div>`).join('')}</div>
    <div class="pied"><span style="font-size:11.5px;font-weight:800;color:var(--doux)">Amitié</span>
      <div class="cs">${[1,2,3,4].map(i=>`<button data-c="${i}" data-hn="${esc(h.n)}" class="${d.coeurs>=i?'on':''}">${coeurSVG(d.coeurs>=i,13)}</button>`).join('')}</div>
      ${rom?`<span style="font-size:11.5px;font-weight:800;color:var(--rose);margin-left:auto">Romance ${d.rom}/4</span>`:''}</div></div>`;}

function ficheHab(x){
  const d=S.hab[x.n],f=S.fiches['hab:'+x.n];
  return `<div class="carte"><div class="ct"><h3>Fiche de ${esc(x.n)}</h3>
      <div style="display:flex;gap:8px"><button class="btn ia-only" id="fiche-hab">${f?'Actualiser':'Charger la fiche'}</button>
      <button class="btn2" data-oeil="${esc(x.n)}">Fermer</button>
      ${btnImg(x.n)}

/* ---------- JARDIN ---------- */
function calculJardin(){
  const T=S.taille,g=S.jardin,res={eau:0,herbe:0,recolte:0,qualite:0,vitesse:0},buffs=g.map(()=>new Set());
  g.forEach((c,i)=>{if(!c)return;const x=i%T,y=(i/T|0),cu=CULTURES.find(p=>p.id===c.c);if(!cu)return;
    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([nx,ny])=>{if(nx<0||ny<0||nx>=T||ny>=T)return;
      const j=ny*T+nx,v=g[j];if(!v||v.c===c.c||!BONUS[cu.b])return;buffs[j].add(cu.b);});});
  buffs.forEach((s,i)=>{if(g[i])s.forEach(b=>res[b]++);});
  let or=0;g.forEach((c,i)=>{if(!c)return;const cu=CULTURES.find(p=>p.id===c.c);if(cu)or+=cu.prixN*(cu.rend||2)*(buffs[i].has('recolte')?1.5:1);});
  const pl=g.filter(Boolean).length;return{res,plantes:pl,or:Math.round(or),buffs,total:pl||1};}
function vJardin(){
  const T=S.taille,k=calculJardin();

  reglages:vReglages,decoupe:vDecoupe,auto:vAuto,
  poissons:()=>vGuide('poissons'),insectes:()=>vGuide('insectes'),chasse:()=>vGuide('chasse')};
function rendre(){
  $('#rail').innerHTML=railHTML();
  $('#vue').innerHTML=(editT?vEdit():'')+(toastMsg?`<div class="toast">${esc(toastMsg)}
    ${toastAction?'<button id="annuler-toast" class="toast-b">Annuler</button>':''}</div>`:'')+(hist.length?`<button class="retour" id="btn-retour">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Retour</button>`:'')+VUES[vue]();
  $('#tousobjets').innerHTML=tousNoms().map(n=>`<option value="${esc(n)}">`).join('');
