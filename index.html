setInterval(()=>{if(roueTourne||calSel)return;if(['notifications','poissons','insectes','chasse','jardin','elevage'].includes(vue))rendre();else $('#rail').innerHTML=railHTML();},30000);

/* --- Infobulle du calendrier --- */
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('[data-info]'),b=document.getElementById('bulle');
  if(!b)return;
  if(!c){b.style.display='none';return;}
  b.textContent=c.dataset.info;b.style.display='block';
  const r=c.getBoundingClientRect();
  b.style.left=Math.min(window.innerWidth-240,Math.max(8,r.left-70))+'px';
  b.style.top=(r.top>190?r.top-b.offsetHeight-10:r.bottom+10)+'px';});
document.addEventListener('mouseout',e=>{
  if(e.target.closest('[data-info]')){const b=document.getElementById('bulle');if(b)b.style.display='none';}});

/* --- Découpe : viseur et clic --- */
document.addEventListener('mousemove',e=>{
  const z=document.getElementById('zone-img');if(!z)return;
  const v=document.getElementById('viseur'),img=document.getElementById('img-src');
  if(!v||!img)return;
  const r=img.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){v.style.display='none';return;}
  const d=decoupeTaille/100*r.width;
  v.style.display='block';v.style.width=v.style.height=d+'px';
  v.style.left=(e.clientX-r.left)+'px';v.style.top=(e.clientY-r.top)+'px';});

document.addEventListener('click',e=>{
  const img=e.target.closest('#img-src');if(!img)return;
  const r=img.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
  const C=ciblesPhotos(),cur=C[decoupeIdx];if(!cur)return;
  const dat=couper(px,py);if(!dat)return;
  PH[cur.k]=dat;savePhotos();
  let n=decoupeIdx+1;while(n<C.length&&PH[C[n].k])n++;
  decoupeIdx=Math.min(n,C.length-1);rendre();});

document.addEventListener('input',e=>{
  if(e.target.id==='taille-dec'){decoupeTaille=+e.target.value;
    const l=e.target.previousElementSibling;if(l)l.textContent='Taille du découpage : '+decoupeTaille+'%';}});
function vignette(file){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;
      const x=c.getContext('2d'),m=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,128,128);
      res(c.toDataURL('image/jpeg',0.8));};
    img.onerror=()=>res(null);img.src=r.result;};
  r.onerror=()=>res(null);r.readAsDataURL(file);});}
const sansAccent=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase();

$('#fichier').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';
  if(!fs.length){photoCible='';return;}

  if(photoCible==='__save__'){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.S){S=d.S;save();}if(d.PH){PH=d.PH;savePhotos();}
      alert('Sauvegarde restaurée !');rendre();}catch(err){alert('Ce fichier n\'est pas une sauvegarde valide.');}};
    r.readAsText(fs[0]);photoCible='';
    $('#fichier').setAttribute('accept','image/*');return;}

  if(photoCible==='__groupe__'||photoCible==='__auto__'){
    const mode=photoCible;
    const r=new FileReader();
    r.onload=()=>{decoupeSrc=r.result;IMGOBJ=new Image();
      IMGOBJ.onload=()=>{
        if(mode==='__auto__'){lancerAuto();return;}
        const C=ciblesPhotos();let i=C.findIndex(x=>!PH[x.k]);
        decoupeIdx=i<0?0:i;vue='decoupe';rendre();};
      IMGOBJ.src=decoupeSrc;};
    r.readAsDataURL(fs[0]);photoCible='';return;}

  if(photoCible==='__lot__'){
    let ok=0,rates=[];
    for(const f of fs){
      const base=sansAccent(f.name.replace(/\.[^.]+$/,''));
      const c=toutesCibles().find(x=>sansAccent(x.n)===base);
      if(!c){rates.push(f.name);continue;}
      const img=await vignette(f);if(!img){rates.push(f.name);continue;}
      PH[c.k]=img;ok++;}
    savePhotos();photoCible='';rendre();
    const z=$('#import-res');
    if(z)z.innerHTML=`✓ ${ok} image${ok>1?'s':''} associée${ok>1?'s':''}.`+
      (rates.length?`<br><span style="color:var(--or)">Non reconnus : ${rates.slice(0,6).map(esc).join(', ')}${rates.length>6?'…':''}</span>`:'');
    return;}

  const img=await vignette(fs[0]);
  if(img){PH[photoCible]=img;savePhotos();}
  photoCible='';rendre();});

document.addEventListener('click',async e=>{
  if(e.target.closest('#btn-retour')){retour();return;}
  if(e.target.id==='annuler-toast'){annulerToast();return;}
  // Deux boutons distincts : l'un change l'image, l'autre la supprime
  const phd=e.target.closest('[data-photo-del]');
  if(phd){e.stopPropagation();const n=phd.dataset.photoDel;
    if(!confirm('Supprimer cette image ?'))return;
    const sauve=PH[n];delete PH[n];savePhotos();rendre();
    montrerToast('Image supprimée',()=>{PH[n]=sauve;savePhotos();});return;}
  const ph=e.target.closest('[data-photo]');
  if(ph){e.stopPropagation();photoCible=ph.dataset.photo;
    $('#fichier').removeAttribute('multiple');$('#fichier').setAttribute('accept','image/*');
    $('#fichier').click();return;}

  /* Calendrier */
  const cjr=e.target.closest('[data-jour]');if(cjr){calSel=cjr.dataset.jour;rendre();return;}
  if(e.target.id==='jour-auj'){calSel=cleJ(new Date());rendre();return;}
  if(e.target.id==='fermer-jour'||e.target.id==='modal-jour'){sauverJour();return;}
  if(e.target.id==='save-jour'){sauverJour();return;}
  if(e.target.id==='suppr-jour'){if(!confirm('Effacer cette journée ?'))return;
    delete S.cal[calSel];calSel=null;save();rendre();return;}
  const ja=e.target.closest('[data-ja]');
  if(ja){const j=S.cal[calSel]||{};j.act=j.act===ja.dataset.ja?'':ja.dataset.ja;S.cal[calSel]=j;save();rendre();return;}
  const jh=e.target.closest('[data-jh]');
  if(jh){const j=S.cal[calSel]||{};j.hum=j.hum===jh.dataset.jh?'':jh.dataset.jh;S.cal[calSel]=j;save();rendre();return;}
  const jn=e.target.closest('[data-jn]');
  if(jn){const j=S.cal[calSel]||{};j.niv=+jn.dataset.jn;S.cal[calSel]=j;save();rendre();return;}
  const ann=e.target.closest('[data-an]');
  if(ann){calAnnee=Math.min(new Date().getFullYear(),calAnnee+ +ann.dataset.an);rendre();return;}
  if(e.target.id==='cal-auj'){calAnnee=new Date().getFullYear();rendre();
    setTimeout(()=>{const z=document.getElementById('cal-scroll');if(z)z.scrollLeft=z.scrollWidth;},60);return;}
  const fa=e.target.closest('[data-fa]');if(fa){calFiltre=fa.dataset.fa;rendre();return;}

  /* Outils */
  const fcou=e.target.closest('[data-fco]');if(fcou){fCoinOut=fcou.dataset.fco;rendre();return;}
  const feo=e.target.closest('[data-feo]');if(feo){fEtatOut=feo.dataset.feo;rendre();return;}
  const oe=e.target.closest('[data-oe]');
  if(oe){e.stopPropagation();const n=oe.dataset.oe,k2=oe.dataset.k,x=S.out[n]||(S.out[n]={});
    x[k2]=!x[k2];
    if(k2==='max'&&x.max){x.p1=x.p2=x.p3=1;}
    if(k2==='amel'&&x.amel&&!x.p1)x.p1=1;
    save();rendre();return;}
  const dur=e.target.closest('[data-dur]');
  if(dur){const n=dur.dataset.dur,x=S.out[n]||(S.out[n]={}),v=dur.dataset.v;
    x.dur = v==='reset' ? 100 : Math.max(0,Math.min(100,(x.dur!==undefined?x.dur:100)+ +v));
    save();rendre();return;}
  const cib=e.target.closest('[data-cible]');
  if(cib){cibleAmel[cib.dataset.cible]=+cib.dataset.v;rendre();return;}
  const sto=e.target.closest('[data-sto]');
  if(sto){const n=sto.dataset.sto;S.stockOut[n]=Math.max(0,(S.stockOut[n]||0)+ +sto.dataset.v);save();rendre();return;}
  if(e.target.closest('[data-out-fermer]')){selOut=null;rendre();return;}
  const otc=e.target.closest('[data-out]');
  if(otc&&!e.target.closest('[data-oe]')){pousser();const id=otc.dataset.out;
    selOut=selOut===id?null:id;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}

  /* Meubles */
  const fco=e.target.closest('[data-fcol]');if(fco){fColMeub=fco.dataset.fcol;rendre();return;}
  const fcm=e.target.closest('[data-fcatm]');if(fcm){fCatMeub=fcm.dataset.fcatm;rendre();return;}
  const mfa=e.target.closest('[data-meub-fait]');
  if(mfa){e.stopPropagation();const n=mfa.dataset.meubFait,x=S.meub[n]||(S.meub[n]={});
    x.fait=!x.fait;save();rendre();return;}
  const mfv=e.target.closest('[data-meub-fav]');
  if(mfv){e.stopPropagation();const n=mfv.dataset.meubFav,x=S.meub[n]||(S.meub[n]={});
    x.fav=!x.fav;save();rendre();return;}
  if(e.target.closest('[data-meub-fermer]')){selMeub=null;rendre();return;}
  const mbc=e.target.closest('[data-meub]');
  if(mbc&&!e.target.closest('[data-meub-fait],[data-meub-fav]')){
    pousser();const i=+mbc.dataset.meub;selMeub=selMeub===i?null:i;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}

  /* Ressources */
  const fcr=e.target.closest('[data-fcr]');if(fcr){fCatRes=fcr.dataset.fcr;rendre();return;}
  const reu=e.target.closest('[data-res-eu]');
  if(reu){e.stopPropagation();const n=reu.dataset.resEu;const x=S.res[n]||(S.res[n]={});
    x.eu=!x.eu;save();rendre();return;}
  const rfv=e.target.closest('[data-res-fav]');
  if(rfv){e.stopPropagation();const n=rfv.dataset.resFav;const x=S.res[n]||(S.res[n]={});
    x.fav=!x.fav;save();rendre();return;}
  if(e.target.closest('[data-res-fermer]')){selRes=null;rendre();return;}
  const rno=e.target.closest('[data-res-nom]');
  if(rno){const r=listeRes().find(x=>x.n===rno.dataset.resNom);
    if(r){pousser();selRes=r.i;vue='ressources';rendre();window.scrollTo({top:0});}return;}
  const rsc=e.target.closest('[data-res]');
  if(rsc&&!e.target.closest('[data-res-eu],[data-res-fav]')){
    pousser();const i=+rsc.dataset.res;selRes=selRes===i?null:i;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}
  // Liens entre fiches
  const lv=e.target.closest('[data-vers]');
  if(lv){pousser();vue=lv.dataset.vers;selG=+lv.dataset.i;selRes=null;rendre();window.scrollTo({top:0});return;}
  const lr=e.target.closest('[data-vers-rec]');
  if(lr){pousser();vue='recettes';selR=+lr.dataset.versRec;selRes=null;rendre();window.scrollTo({top:0});return;}
  const lh=e.target.closest('[data-vers-hab]');
  if(lh){pousser();vue='habitants';selHab=lh.dataset.versHab;selRes=null;rendre();window.scrollTo({top:0});return;}

  /* Jardin : économie */
  const jo=e.target.closest('[data-jo]');if(jo){S.jrd.onglet=jo.dataset.jo;save();rendre();return;}
  const qm=e.target.closest('[data-qmode]');
  if(qm){S.jrd.mode=qm.dataset.qmode;
    if(S.jrd.mode==='auto')S.jrd.stock={};else{
      const prod=productionTerrain();
      Object.keys(prod).forEach(id=>{const r=prod[id],et=Math.round(r.total*r.chanceEtoile/100);
        S.jrd.stock[id]={n:r.total-et,e:et,dest:(S.jrd.stock[id]||{}).dest||'vendre'};});}
    save();rendre();return;}
  const de=e.target.closest('[data-dest]');
  if(de){const id=de.dataset.dest;const st=S.jrd.stock[id]||(S.jrd.stock[id]={n:null,e:null,dest:'vendre'});
    st.dest=de.dataset.v;save();rendre();return;}
  const en=e.target.closest('[data-eng]');
  if(en){const id=en.dataset.eng;
    S.jrd.engrais[id]=Math.max(0,(S.jrd.engrais[id]||0)+ +en.dataset.v);save();rendre();return;}
  const vd=e.target.closest('[data-vendre]');
  if(vd){encaisser(vd.dataset.vendre);return;}
  if(e.target.id==='vider-ventes'){if(!confirm('Effacer l\'historique des ventes ?'))return;
    const copie=S.jrd.ventes.slice();S.jrd.ventes=[];save();rendre();
    montrerToast('Historique effacé',()=>{S.jrd.ventes=copie;save();});return;}
  const sc=e.target.closest('[data-sc]');if(sc){S.jrd.simu.c=sc.dataset.sc;save();rendre();return;}
  const sb=e.target.closest('[data-sb]');if(sb){S.jrd.simu[sb.dataset.sb]=!S.jrd.simu[sb.dataset.sb];save();rendre();return;}
  const sd=e.target.closest('[data-sd]');if(sd){S.jrd.simu.dest=sd.dataset.sd;save();rendre();return;}

  /* Aventures */
  const pc=e.target.closest('[data-parc]');
  if(pc){pousser();selParc=pc.dataset.parc;rendre();window.scrollTo({top:0});return;}
  if(e.target.closest('[data-parc-retour]')){selParc=null;rendre();return;}
  const df=e.target.closest('[data-diff]');
  if(df){S.parc[df.dataset.diff].diff=df.dataset.v;save();rendre();return;}
  const ob=e.target.closest('[data-obj]');
  if(ob){const d=S.parc[ob.dataset.obj],i=ob.dataset.i;
    d.c[i]=Math.max(0,(d.c[i]||0)+ +ob.dataset.v);save();rendre();return;}
  const oo=e.target.closest('[data-or]');
  if(oo){const d=S.parc[oo.dataset.or];
    d.or=Math.max(0,(d.or||0)+ +oo.dataset.v);save();rendre();return;}
  const vp=e.target.closest('[data-valider]');
  if(vp){validerPalier(vp.dataset.valider);return;}
  const rp=e.target.closest('[data-reparc]');
  if(rp){if(!confirm('Recommencer ce parcours depuis le palier 1 ?'))return;
    S.parc[rp.dataset.reparc]={p:0,diff:S.parc[rp.dataset.reparc].diff,c:{},or:0,hist:S.parc[rp.dataset.reparc].hist||[]};
    save();rendre();return;}

  /* Roue */
  if(e.target.id==='tourner'||e.target.id==='rejouer'){tournerRoue();return;}
  if(e.target.id==='mode-edit'){roueEdit=!roueEdit;rendre();return;}
  if(e.target.id==='add-act'){
    const cs=['#7B4DE0','#2FB58A','#3A9BE0','#F0A62F','#E8467C','#C25B3A','#6FBF3F','#B85FD0'];
    S.roue.push({n:'Nouvelle activité',e:'⭐',c:cs[S.roue.length%cs.length],v:''});save();rendre();return;}
  if(e.target.id==='reset-roue'){if(!confirm('Remettre la liste d\'origine ?'))return;
    S.roue=JSON.parse(JSON.stringify(ROUE_DEFAUT));save();rendre();return;}
  const ras=e.target.closest('[data-ra-s]');
  if(ras){S.roue.splice(+ras.dataset.raS,1);roueRes=null;save();rendre();return;}
  if(e.target.id==='commencer'){
    if(!roueRes){rendre();return;}
    // On envoie vers le parcours de cette activité, là où elle en est
    const cle=roueRes.parc||Object.keys(PARCOURS).find(k=>sansAccent(PARCOURS[k].n)===sansAccent(roueRes.n));
    roueRes=null;pousser();
    if(cle){selParc=cle;vue='aventures';}else{vue='aventures';selParc=null;}
    rendre();window.scrollTo({top:0});return;}

  const ed=e.target.closest('[data-edit]');
  if(ed){e.stopPropagation();editT=ed.dataset.edit;editK=ed.dataset.cle;rendre();return;}
  if(e.target.id==='fermer-edit'||e.target.id==='modal-edit'){editT='';editK='';rendre();return;}
  if(e.target.id==='save-edit'){enregistrerEdit();return;}
  if(e.target.id==='suppr-edit'){supprimerPerso(editT,editK);return;}
  const aj=e.target.closest('[data-ajout]');
  if(aj){ajouterElement(aj.dataset.ajout);return;}
  const sp2=e.target.closest('[data-suppr-perso]');
  if(sp2){supprimerPerso(sp2.dataset.supprPerso,sp2.dataset.cle);return;}
  const bp=e.target.closest('[data-photos]');
  if(bp){pousser();catPhoto=bp.dataset.photos;photoCible='__auto__';  // catégorie utile seulement au mode manuel
    $('#fichier').removeAttribute('multiple');$('#fichier').setAttribute('accept','image/*');
    $('#fichier').click();return;}
  const cp=e.target.closest('[data-catp]');
  if(cp){catPhoto=cp.dataset.catp;
    const C=ciblesPhotos();let i=C.findIndex(x=>!PH[x.k]);decoupeIdx=i<0?0:i;
    if(vue==='auto'&&autoRes.length){const libres=C.filter(x=>!PH[x.k]);
      autoRes.forEach((r,j)=>{r.nom=libres[j]?libres[j].k:'';});}
    rendre();return;}

  /* Découpage automatique */
  if(e.target.id==='auto-photos'){pousser();photoCible='__auto__';
    $('#fichier').removeAttribute('multiple');$('#fichier').click();return;}
  if(e.target.id==='mode-manuel'){const C=ciblesPhotos();
    let i=C.findIndex(x=>!PH[x.k]);decoupeIdx=i<0?0:i;vue='decoupe';rendre();return;}
  if(e.target.id==='valider-auto'){
    let n=0;autoRes.forEach(r=>{if(r.nom){PH[r.nom]=r.dat;n++;}});
    savePhotos();autoRes=[];
    if(autoBilan)autoBilan.ranges+=n;
    rendre();return;}

  /* Découpeur */
  if(e.target.id==='ouvrir-decoupe'){pousser();vue='decoupe';rendre();return;}
  if(e.target.id==='choisir-groupe'||e.target.id==='changer-groupe'){
    photoCible='__groupe__';$('#fichier').removeAttribute('multiple');$('#fichier').click();return;}
  const dc=e.target.closest('[data-dec]');
  if(dc){const C=ciblesPhotos();
    decoupeIdx=Math.max(0,Math.min(C.length-1,decoupeIdx+ +dc.dataset.dec));rendre();return;}
  const cb=e.target.closest('[data-cible]');
  if(cb){decoupeIdx=+cb.dataset.cible;rendre();return;}

  /* Réglages */
  if(e.target.id==='regler-heure'){pousser();vue='reglages';rendre();return;}
  if(e.target.id==='valider-heure'){
    const v=$('#heure-jeu').value;
    if(recaler(v))rendre();else alert('Écris l\'heure comme dans le jeu, par exemple 14:30');return;}
  if(e.target.id==='reset-heure'){S.decal=0;save();rendre();return;}
  if(e.target.id==='btn-installer'){installer();return;}
  if(e.target.id==='save-cle'){API_KEY=$('#cle-api').value.trim();store.set(CLE_API,API_KEY);document.body.classList.toggle('sans-ia',!iaDispo());rendre();return;}
  if(e.target.id==='del-cle'){API_KEY='';store.set(CLE_API,'');rendre();return;}
  if(e.target.id==='import-lot'){photoCible='__lot__';$('#fichier').setAttribute('multiple','');$('#fichier').click();return;}
  if(e.target.id==='vider-photos'){if(!confirm('Effacer toutes les images ?'))return;PH={};savePhotos();rendre();return;}
  if(e.target.id==='export'){
    const b=new Blob([JSON.stringify({S,PH})],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='palia-sauvegarde.json';a.click();return;}
  if(e.target.id==='import'){photoCible='__save__';$('#fichier').removeAttribute('multiple');
    $('#fichier').setAttribute('accept','.json,application/json');$('#fichier').click();return;}

  /* Ajout de recette */

  const nav=e.target.closest('[data-vue]');if(nav){pousser();vue=nav.dataset.vue;selG=null;rechG='';fReg=fRar=fEtat='tous';rendre();return;}
  const go=e.target.closest('[data-go]');if(go){pousser();vue=go.dataset.go;selG=null;rendre();return;}
  if(e.target.closest('[data-arrose]')){S.arrose=jourJardin();save();rendre();return;}
  const pas=e.target.closest('[data-pas]');
  if(pas){const id=pas.closest('[data-skill]').dataset.skill;S.skills[id]=Math.max(0,Math.min(NIV_MAX,S.skills[id]+ +pas.dataset.pas));save();rendre();return;}

  /* Recettes */
  const frc=e.target.closest('[data-frc]');if(frc){fRec=frc.dataset.frc;rendre();return;}
  const fst=e.target.closest('[data-fst]');if(fst){fSt=fst.dataset.fst;rendre();return;}
  const cui=e.target.closest('[data-cuit]');
  if(cui){e.stopPropagation();const r=lireRec(+cui.dataset.cuit);
    if(S.cuisine[r.en])delete S.cuisine[r.en];else S.cuisine[r.en]=1;save();rendre();return;}
  if(e.target.closest('[data-fermer-rec]')){selR=null;rendre();return;}
  const rc=e.target.closest('[data-rec]');
  if(rc){pousser();const i=+rc.dataset.rec;selR=selR===i?null:i;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}
  const iq=e.target.closest('[data-ingq]');
  if(iq){const r=lireRec(+iq.dataset.ir),j=+iq.dataset.j,l=S.ing[r.en];
    l[j].q=Math.max(1,l[j].q+ +iq.dataset.ingq);save();rendre();return;}
  const ip=e.target.closest('[data-ingplus]');
  if(ip){const r=lireRec(+ip.dataset.ingplus);S.ing[r.en]=(S.ing[r.en]||[]).concat([{n:'',q:1}]);save();rendre();return;}
  const ic=e.target.closest('[data-ingclear]');
  if(ic){const r=lireRec(+ic.dataset.ingclear);delete S.ing[r.en];save();rendre();return;}
  const i1=e.target.closest('[data-ing1]');
  if(i1){const r=lireRec(+i1.dataset.ing1);i1.disabled=true;i1.textContent='…';
    try{const a=await iaJSON(`Recette de Palia : "${r.en}" (${r.fr}), cuisinée au ${STATIONS[r.st].n}, ${r.pas} étapes.
Donne UNIQUEMENT un tableau JSON des ingrédients, format [{"n":"nom français de l'ingrédient","q":quantité}].
Utilise si possible ces noms exacts : ${tousNoms().slice(0,120).join(', ')}.
Si tu n'es pas sûr, donne quand même ta meilleure estimation.`,600);
      if(Array.isArray(a))S.ing[r.en]=a.filter(x=>x&&x.n).map(x=>({n:String(x.n),q:Math.max(1,+x.q||1)}));}
    catch(err){alert(ERREUR);}
    save();rendre();return;}
  if(e.target.id==='fill-ing'){await remplirIngredients(e.target);return;}

  /* Élevage */
  if(e.target.closest('[data-fermer-an]')){selAn=null;rendre();return;}
  const anf=e.target.closest('[data-an-f]');
  if(anf&&!e.target.closest('[data-jai],[data-ra],[data-caresse],[data-nourri],[data-photo]')){
    pousser();const i=+anf.dataset.anF;selAn=selAn===i?null:i;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}
  const jai=e.target.closest('[data-jai]');
  if(jai){const a=jai.dataset.jai;S.ranch[a].nb=S.ranch[a].nb>0?0:1;save();rendre();return;}
  const ra=e.target.closest('[data-ra]');
  if(ra){const a=ra.dataset.an;S.ranch[a].nb=Math.max(0,S.ranch[a].nb+ +ra.dataset.ra);save();rendre();return;}
  const car=e.target.closest('[data-caresse]');
  if(car){S.ranch[car.dataset.caresse].caresse=Date.now();save();rendre();return;}
  const nou=e.target.closest('[data-nourri]');
  if(nou){const r=S.ranch[nou.dataset.nourri],jp=jourPalia();r.nourri=r.nourri===jp?'':jp;save();rendre();return;}

  /* Habitants */
  const fh=e.target.closest('[data-fh]');if(fh){fHab=fh.dataset.fh;rendre();return;}
  if(e.target.id==='new-semaine'){
    if(!confirm('Effacer les envies écrites pour tous les habitants ?'))return;
    const copie=JSON.parse(JSON.stringify(HABITANTS.map(h=>S.hab[h.n].envies)));
    HABITANTS.forEach(h=>S.hab[h.n].envies=envieVide());S.semaine=cleSemaine();S.nouvSem=0;save();
    montrerToast('Envies effacées',()=>{HABITANTS.forEach((h,i)=>{if(copie[i])S.hab[h.n].envies=copie[i];});save();});
    rendre();return;}
  const oeil=e.target.closest('[data-oeil]');
  if(oeil){pousser();selHab=selHab===oeil.dataset.oeil?null:oeil.dataset.oeil;rendre();return;}
  const par=e.target.closest('[data-parle]');
  if(par){const d=S.hab[par.dataset.parle],jp=jourPalia();d.parle=d.parle===jp?'':jp;save();rendre();return;}
  const cj=e.target.closest('[data-cadeaujour]');
  if(cj){const d=S.hab[cj.dataset.cadeaujour],jp=jourPalia();d.cadeauJour=d.cadeauJour===jp?'':jp;save();rendre();return;}
  const rm=e.target.closest('[data-rom]');
  if(rm){const d=S.hab[rm.dataset.rom];d.rom=(d.rom+1)%5;save();rendre();return;}
  const am=e.target.closest('[data-aime]');
  if(am){const d=S.hab[am.dataset.aime];d.envies[+am.dataset.i].aime=!d.envies[+am.dataset.i].aime;save();rendre();return;}
  const dn=e.target.closest('[data-donne]');
  if(dn){const d=S.hab[dn.dataset.donne];d.envies[+dn.dataset.i].donne=!d.envies[+dn.dataset.i].donne;save();rendre();return;}
  const lk=e.target.closest('[data-likes]');
  if(lk){pousser();selHab=lk.dataset.likes;rendre();const b=$('#fiche-hab');
    if(b&&!S.fiches['hab:'+selHab])b.click();
    const el=$('#fiche-res');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return;}
  const cc=e.target.closest('[data-c]');
  if(cc){const n=cc.dataset.hn,i=+cc.dataset.c,d=S.hab[n];d.coeurs=d.coeurs===i?i-1:i;save();rendre();return;}
  if(e.target.id==='fiche-hab'){const nom=selHab,b=e.target;b.disabled=true;b.textContent='…';
    $('#fiche-res').innerHTML='<span class="points"><span></span><span></span><span></span></span>';
    try{S.fiches['hab:'+nom]=await ia(`Fiche complète de **${nom}**, habitant de Palia. Sans titres markdown :
Qui c'est : (2 lignes)
Cadeaux préférés : (ce qu'il adore, puis ce qu'il aime)
Où le trouver : (lieux et horaires)
Ses quêtes : (les principales)
Récompenses d'amitié : (niveaux 1 à 4)
Conseil : (1 phrase)
Si ce personnage n'existe pas dans Palia, dis-le simplement.`,false,1100);}catch(err){S.fiches['hab:'+nom]=ERREUR;}
    save();rendre();return;}

  /* Guides */
  const pr=e.target.closest('[data-pris]');
  if(pr){e.stopPropagation();const t=pr.dataset.type,k=cleE(t,lire(t,+pr.dataset.pris));
    if(S.pris[k])delete S.pris[k];else S.pris[k]=1;save();rendre();return;}
  const fb=e.target.closest('[data-favb]');
  if(fb){e.stopPropagation();const t=fb.dataset.type,k=cleE(t,lire(t,+fb.dataset.favb));
    if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();rendre();return;}
  const fe=e.target.closest('[data-fe]');if(fe){fEtat=fe.dataset.fe;rendre();return;}
  const fr2=e.target.closest('[data-fr2]');if(fr2){fReg=fr2.dataset.fr2;rendre();return;}
  const fra=e.target.closest('[data-fra]');if(fra){fRar=fra.dataset.fra;rendre();return;}
  const ge=e.target.closest('[data-ge]');
  if(ge){pousser();const i=+ge.dataset.ge;selG=selG===i?null:i;rendre();window.scrollTo({top:0,behavior:'smooth'});return;}
  const fg=e.target.closest('[data-fg]');
  if(fg){const t=fg.dataset.type,x=lire(t,+fg.dataset.fg),k=cleE(t,x);
    fg.disabled=true;fg.textContent='…';
    try{S.fiches[k]=await ia(`Dans Palia, conseils pratiques pour **${x.en}** (${x.fr}).
Déjà connu : région ${REGIONS[x.region]}${x.eau?', eau : '+x.eau:''}${x.habitat?', endroit : '+x.habitat:''}${x.appat?', appât : '+x.appat:''}, rareté ${RARETE[x.rarete].n}.
En 6 lignes maximum, sans titres : les endroits précis, la technique pour ne pas le rater, à quoi il sert.`,false,700);}
    catch(err){S.fiches[k]=ERREUR;}
    save();rendre();return;}

  /* Assistant */

  /* Inventaire */
  const cat=e.target.closest('[data-cat]');if(cat){filtreInv=cat.dataset.cat;rendre();return;}
  const q=e.target.closest('[data-q]');
  if(q){const n=q.closest('[data-obj]').dataset.obj;S.inv[n]=Math.max(0,(S.inv[n]||0)+ +q.dataset.q);save();rendre();return;}
  const obj=e.target.closest('[data-obj]');if(obj){const n=obj.dataset.obj;S.inv[n]=S.inv[n]>0?0:1;save();rendre();return;}
  if(e.target.id==='crafter'){if(!Object.values(S.inv).some(v=>v>0)){$('#craft-res').textContent='Coche d\'abord quelques objets.';return;}
    await bloc(e.target,'#craft-res','Avec exactement ces objets : 3 choses utiles à fabriquer ou cuisiner maintenant, et 1 chose à garder précieusement.');return;}

  /* Jardin */
  const pl=e.target.closest('[data-plante]');if(pl){selPlante=pl.dataset.plante;rendre();return;}
  const cs=e.target.closest('.case');
  if(cs){const i=+cs.dataset.i;S.jardin[i]=(S.jardin[i]&&S.jardin[i].c===selPlante)?null:{c:selPlante,t:Date.now()};save();rendre();return;}
  if(e.target.id==='vider-j'){
    if(!S.jardin.some(Boolean))return;
    const copie=S.jardin.slice();
    if(!confirm('Vider tout le terrain ? Tu pourras annuler juste après.'))return;
    S.jardin=Array(S.taille*S.taille).fill(null);save();
    montrerToast('Terrain vidé',()=>{S.jardin=copie;save();});return;}
  if(e.target.id==='taille'){
    // On garde les deux terrains en mémoire au lieu d'en effacer un
    S['jardin'+S.taille]=S.jardin;
    S.taille=S.taille===6?9:6;
    const g=S['jardin'+S.taille];
    S.jardin=(Array.isArray(g)&&g.length===S.taille*S.taille)?g:Array(S.taille*S.taille).fill(null);
    save();rendre();return;}
  if(e.target.id==='opti'){const plan=S.jardin.map((c,i)=>c?`(${i%S.taille+1},${(i/S.taille|0)+1})=${(CULTURES.find(p=>p.id===c.c)||{}).nom}`:null).filter(Boolean).join(', ')||'vide';
    await bloc(e.target,'#opti-res',`Mon jardin ${S.taille}×${S.taille} : ${plan}.
Bonus : ${CULTURES.map(c=>c.nom+'→'+bonusDe(c.b).nom).join(', ')}. Les bonus vont seulement en haut/bas/gauche/droite et une plante ne se booste pas elle-même.
Donne 3 changements précis (quelle case, quelle plante).`);return;}

  /* Encyclopédie */
});
document.addEventListener('contextmenu',e=>{const cs=e.target.closest('.case');if(!cs)return;
  e.preventDefault();S.jardin[+cs.dataset.i]=null;save();rendre();});
document.addEventListener('change',e=>{
  if(e.target.id==='ed-n'&&editT){majEdit();return;}
  const an=e.target.closest('[data-auton]');
  if(an){autoRes[+an.dataset.auton].nom=e.target.value;return;}
  const lu=e.target.closest('[data-lieu]');
  if(lu){S.hab[lu.dataset.lieu].lieu=e.target.value;save();}});
document.addEventListener('input',e=>{
  const rn=e.target.closest('[data-ra-n]');if(rn){S.roue[+rn.dataset.raN].n=e.target.value;save();return;}
  const re2=e.target.closest('[data-ra-e]');if(re2){S.roue[+re2.dataset.raE].e=e.target.value;save();return;}
  const rc=e.target.closest('[data-ra-c]');if(rc){S.roue[+rc.dataset.raC].c=e.target.value;save();rendre();return;}
  if(e.target.id==='note-hab'){S.hab[selHab].note=e.target.value;save();return;}
  // Fiche du jour : tout est retenu à la frappe, rien n'attend le bouton
  if(['j-h','j-m','j-or','j-note'].includes(e.target.id)&&calSel){
    const j=S.cal[calSel]||{};
    const h=+($('#j-h')||{}).value||0,m=+($('#j-m')||{}).value||0;
    j.min=h*60+m;j.or=+($('#j-or')||{}).value||0;
    j.note=(($('#j-note')||{}).value||'').slice(0,300);
    S.cal[calSel]=j;save();return;}
  // Fenêtre de modification : idem, sauf le nom qui attend de quitter le champ
  // Ce qui est tapé dans une barre d'ajout survit à la navigation
  const br=e.target.id.match(/^(hab|anm|cul|obj|rec|gd)-(\w+)$/);
  if(br){(brouillons[br[1]]=brouillons[br[1]]||{})[br[2]]=e.target.value;return;}
  if(e.target.id==='base-etoile'){S.jrd.baseEtoile=Math.max(0,Math.min(100,+e.target.value||0));save();
    const p=e.target.selectionStart;rendre();const c=$('#base-etoile');if(c){c.focus();try{c.setSelectionRange(p,p);}catch(x){}}return;}
  if(['sm-nb','sm-star','sm-eng'].includes(e.target.id)){
    const m={'sm-nb':'nb','sm-star':'star','sm-eng':'eng'}[e.target.id];
    S.jrd.simu[m]=Math.max(0,+e.target.value||0);save();
    const id=e.target.id,p=e.target.selectionStart;rendre();
    const c=$('#'+id);if(c){c.focus();try{c.setSelectionRange(p,p);}catch(x){}}return;}
  const qq=e.target.closest('[data-q]');
  if(qq){const id=qq.dataset.c,st=S.jrd.stock[id]||(S.jrd.stock[id]={n:0,e:0,dest:'vendre'});
    st[qq.dataset.q]=Math.max(0,+e.target.value||0);save();return;}
  const ec=e.target.closest('[id^="ed-"]');
  if(ec&&editT&&ec.id!=='ed-n'){majEdit();return;}
  const ct=e.target.closest('[data-cadtxt]');if(ct){S.hab[ct.dataset.cadtxt].cadeauTxt=e.target.value;save();return;}
  const en=e.target.closest('[data-env]');if(en){S.hab[en.dataset.env].envies[+en.dataset.i].n=e.target.value;save();return;}
  if(e.target.id==='rh'){rechH=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rh');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  if(e.target.id==='rg'){rechG=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rg');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  if(e.target.id==='rout'){rechOut=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rout');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  if(e.target.id==='rmeub'){rechMeub=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rmeub');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  if(e.target.id==='rres'){rechRes=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rres');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  if(e.target.id==='rr'){rechR=e.target.value;const p=e.target.selectionStart;rendre();
    const c=$('#rr');if(c){c.focus();c.setSelectionRange(p,p);}return;}
  const ign=e.target.closest('[data-ingn]');
  if(ign){const r=lireRec(+ign.dataset.ingn),j=+ign.dataset.j;
    if(S.ing[r.en]&&S.ing[r.en][j]){S.ing[r.en][j].n=e.target.value;save();}return;}
  const nt=e.target.closest('[data-note]');
  if(nt){S.notes[cleE(nt.dataset.type,lire(nt.dataset.type,+nt.dataset.note))]=e.target.value;save();}});
document.addEventListener('keydown',e=>{
});

async function remplirIngredients(btn){
  if(occupe)return;occupe=true;btn.disabled=true;
  const noms=tousNoms().slice(0,120).join(', ');
  const reste=RECETTES.map((r,i)=>r).filter(r=>!S.ing[r[1]]||!S.ing[r[1]].length);
  let fait=0;
  for(let k=0;k<reste.length;k+=12){
    const lot=reste.slice(k,k+12);
    btn.textContent=`${fait} / ${reste.length} recettes…`;
    try{
      const a=await iaJSON(`Recettes de cuisine du jeu Palia. Pour chacune, donne la liste des ingrédients.
Recettes : ${lot.map(r=>r[1]).join(' | ')}
Réponds UNIQUEMENT par un objet JSON de la forme :
{"Nom anglais de la recette":[{"n":"nom français de l'ingrédient","q":quantité}, ...], ...}
Utilise si possible ces noms d'ingrédients : ${noms}.
Donne ta meilleure estimation même en cas de doute.`,3000);
      Object.entries(a||{}).forEach(([k2,v])=>{
        if(Array.isArray(v))S.ing[k2]=v.filter(x=>x&&x.n).map(x=>({n:String(x.n),q:Math.max(1,+x.q||1)}));});
    }catch(e){}
    fait+=lot.length;save();
  }
  occupe=false;rendre();}

async function bloc(btn,cible,q){if(occupe)return;occupe=true;btn.disabled=true;
  $(cible).innerHTML='<span class="points"><span></span><span></span><span></span></span>';
  try{$(cible).innerHTML=fmt(await ia(q));}catch(e){$(cible).textContent=ERREUR;}
  occupe=false;btn.disabled=false;}
charger().then(()=>{if(!iaDispo())document.body.classList.add('sans-ia');rendre();});

/* ============================================================
   ██ APPLICATION INSTALLABLE
   Le service worker ne fonctionne qu'en https ou en local
   (github.io, localhost). Ouvert par double-clic en file://,
   il est simplement ignoré : l'application marche quand même.
   ============================================================ */
let promptInstall=null, majDispo=false;

if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./service-worker.js',{scope:'./'})
      .then(reg=>{
        reg.addEventListener('updatefound',()=>{
          const nouveau=reg.installing;if(!nouveau)return;
          nouveau.addEventListener('statechange',()=>{
            if(nouveau.state==='installed'&&navigator.serviceWorker.controller){
              majDispo=true;
              montrerToast('Une nouvelle version est prête',()=>{
                nouveau.postMessage('maj-maintenant');location.reload();});}});});
      })
      .catch(()=>{});
    let recharge=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(recharge)return;recharge=true;location.reload();});
  });
}

/* Chrome propose l'installation : on garde la main pour l'offrir au bon moment */
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();promptInstall=e;
  if(vue==='reglages')rendre();
  else montrerToast('📲 Cette application peut être installée',()=>{installer();});
});
window.addEventListener('appinstalled',()=>{
  promptInstall=null;montrerToast('✅ Application installée',null);});

async function installer(){
  if(!promptInstall)return;
  promptInstall.prompt();
  try{await promptInstall.userChoice;}catch(e){}
  promptInstall=null;rendre();
}
function estInstallee(){
  return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: window-controls-overlay)').matches
      || navigator.standalone===true;
}

/* Raccourcis du manifeste : ?onglet=jardin ouvre directement le bon onglet */
(function(){
  const p=new URLSearchParams(location.search).get('onglet');
  if(p&&VUES[p]){vue=p;setTimeout(()=>rendre(),0);}
})();
